name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build V10 Mega
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadi V10 Mega</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column}#splash{position:fixed;inset:0;background:radial-gradient(circle at center,#667eea 0%,#764ba2 50%,#000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;animation:fadeOut .6s ease 3s forwards}#logo{width:130px;height:130px;background:linear-gradient(135deg,#fff,#ddd);border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:70px;animation:pop 1s ease infinite alternate;box-shadow:0 0 40px rgba(102,126,234,.8)}@keyframes pop{0%{transform:scale(1)}100%{transform:scale(1.15)}}@keyframes fadeOut{to{opacity:0;visibility:hidden}}#logoText{margin-top:20px;font-size:32px;font-weight:900;letter-spacing:5px;background:linear-gradient(90deg,#fff,#ff5722);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 1.5s infinite alternate}.loading{margin-top:20px;width:180px;height:5px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden}.bar{height:100%;width:0%;background:linear-gradient(90deg,#fff,#ff5722);animation:load 2.8s ease forwards}@keyframes load{to{width:100%}}.header{background:linear-gradient(90deg,#111,#222);padding:10px;display:flex;justify-content:space-around;font-weight:bold;font-size:11px;border-bottom:1px solid #333}.active{background:#667eea!important;color:#fff!important;border-radius:20px;padding:6px 12px}#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 14px;border-radius:16px;max-width:85%;font-size:14px;white-space:pre-wrap;word-break:break-word}.user{background:linear-gradient(135deg,#667eea,#764ba2);align-self:flex-end;color:#fff}.ai{background:#1e1e1e;border:1px solid #333;align-self:flex-start;color:#fff}#imageTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:12px}.card{background:#1a1a1a;padding:12px;border-radius:12px;border:1px solid #2a2a2a}img#preview{max-width:100%;border-radius:10px;margin-top:8px;transition:.3s}input[type=range]{width:100%;accent-color:#667eea}.btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:6px}.sbtn{padding:7px 12px;border:none;border-radius:8px;background:#2a2a2a;color:#fff;margin:3px;font-size:12px}.sbtn:active{background:#667eea}#timer{display:none;background:#ff5722;color:#fff;padding:8px;text-align:center;font-weight:bold}.input-area{display:flex;padding:10px;background:#111;gap:6px;border-top:1px solid #222}#inp{flex:1;padding:12px;border-radius:25px;background:#222;color:#fff;border:1px solid #333;outline:none}.badge{font-size:9px;background:#ff5722;padding:2px 6px;border-radius:10px;margin-left:5px}</style></head><body>
          <div id="splash"><div id="logo">🔥</div><div id="logoText">SADI</div><div style="letter-spacing:8px;font-size:12px;opacity:.8;margin-top:5px">DEVELOPER</div><div style="margin-top:8px;font-size:11px;opacity:.6">V10 MEGA ULTIMATE</div><div class="loading"><div class="bar"></div></div><div style="margin-top:10px;font-size:10px;opacity:.5">10 Future Loading...</div></div>
          <div class="header"><span id="tC" class="active" onclick="sC()">💬 Chat <span class="badge">AI</span></span><span id="tI" onclick="sI()">🎨 Edit+Gen <span class="badge">PRO</span></span><span id="tV" onclick="sV()">🎤 Voice</span></div>
          <div id="timer"></div>
          <div id="chat"><div class="msg ai">🔥 V10 MEGA Loaded! I am Sadi V10 by SADI DEVELOPER! 10 Future: Splash Logo + Chat History + Free Fire Gen + Cat Unlimited + Pro Edit + Voice + Download + Share + Dark Theme + No Limit!</div></div>
          <div id="imageTab"><div class="card"><b>📸 1. Photo Edit Lab (Pro)</b><br><input type="file" id="fIn" accept="image/*"><img id="preview" style="display:none"><div style="margin-top:8px;display:flex;flex-wrap:wrap"><button class="sbtn" onclick="setF('none')">Original</button><button class="sbtn" onclick="setF('grayscale(100%)')">B&W</button><button class="sbtn" onclick="setF('sepia(100%)')">Sepia</button><button class="sbtn" onclick="setF('contrast(150%) brightness(110%)')">HD Pro</button><button class="sbtn" onclick="setF('blur(1px)')">Blur</button><button class="sbtn" onclick="setF('invert(100%)')">Invert</button><button class="sbtn" onclick="setF('saturate(200%)')">Vivid</button><button class="sbtn" onclick="setF('hue-rotate(90deg)')">Neon</button></div><div style="margin-top:10px"><label>☀️ Brightness: <span id="bVal">100</span>%</label><input type="range" id="bright" min="0" max="200" value="100" oninput="updateEdit()"><label>🌓 Contrast: <span id="cVal">100</span>%</label><input type="range" id="contrast" min="0" max="200" value="100" oninput="updateEdit()"><label>🎨 Saturation: <span id="sVal">100</span>%</label><input type="range" id="satur" min="0" max="200" value="100" oninput="updateEdit()"></div></div><div class="card"><b>🤖 2. AI Generator (Free Fire Special)</b><br><input id="pmt" style="width:100%;padding:10px;margin-top:6px;border-radius:8px;background:#222;color:#fff;border:1px solid #444" placeholder="যেমন: free fire, cat, beautiful girl"><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px"><button class="sbtn" style="background:linear-gradient(135deg,#ff5722,#ff9800)" onclick="quick('free fire')">🔥 Free Fire</button><button class="sbtn" style="background:linear-gradient(135deg,#ff5722,#ff9800)" onclick="quick('free fire character with mp40 gun, gloo wall, hip hop bundle, anime style')">🔫 FF MAX</button><button class="sbtn" onclick="quick('cute cat, cyberpunk')">🐱 Cat</button><button class="sbtn" onclick="quick('free fire dj alok character, gaming')">🎧 Alok</button><button class="sbtn" onclick="quick('pubg character with gun')">PUBG</button></div><button class="btn" onclick="gen()">✨ Generate / Apply Edit</button><div style="display:flex;gap:6px"><button class="btn" style="background:#fff;color:#000;flex:1" onclick="dwn()">⬇️ Download HD</button><button class="btn" style="background:#222;flex:1" onclick="shareImg()">📤 Share</button></div></div></div>
          <div id="voiceTab" style="display:none;flex:1;padding:12px;flex-direction:column;align-items:center;justify-content:center"><div class="card" style="width:100%;text-align:center"><h2>🎤 Voice Studio</h2><button id="micBtn" style="font-size:42px;width:100px;height:100px;border-radius:50%;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;margin:15px">🎤</button><p id="vStatus" style="font-weight:bold">Ready...</p><div style="display:flex;gap:6px;margin-top:10px"><button class="btn" style="flex:1" onclick="speakLast()">🔊 শুনো</button><button class="btn" style="flex:1;background:#333" onclick="stopS()">🔇 থামাও</button></div><button class="btn" style="background:#ff5722;margin-top:8px" onclick="clearHistory()">🗑️ Chat History Clear</button></div></div>
          <div class="input-area"><span onclick="startV()" style="font-size:22px;cursor:pointer">🎤</span><input id="inp" placeholder="Sadi V10 কে প্রশ্ন করো..."><button id="snd" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:bold">SEND</button></div>
          <div style="background:#000;color:#667eea;padding:6px;text-align:center;font-weight:900;font-size:10px;letter-spacing:3px;border-top:1px solid #222">SADI DEVELOPER - V10 MEGA ULTIMATE - 10 FUTURE</div>
          <script>
          setTimeout(()=>{document.getElementById('splash').style.display='none'},3000);
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),snd=document.getElementById('snd'),preview=document.getElementById('preview'),fIn=document.getElementById('fIn'),pmt=document.getElementById('pmt'),timer=document.getElementById('timer'),vStatus=document.getElementById('vStatus'),micBtn=document.getElementById('micBtn');
          let lastImgTime=0,lastAiText="I am Sadi V10 Mega",currentFilter='none';
          function loadHistory(){let h=localStorage.getItem('sadi_v10_history');if(h){chat.innerHTML=h;chat.scrollTop=chat.scrollHeight}}function saveHistory(){localStorage.setItem('sadi_v10_history',chat.innerHTML)}loadHistory();
          function sC(){chat.style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('voiceTab').style.display='none';document.getElementById('tC').classList.add('active');document.getElementById('tI').classList.remove('active');document.getElementById('tV').classList.remove('active')}
          function sI(){chat.style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('voiceTab').style.display='none';document.getElementById('tI').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tV').classList.remove('active')}
          function sV(){chat.style.display='none';document.getElementById('imageTab').style.display='none';document.getElementById('voiceTab').style.display='flex';document.getElementById('tV').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function addM(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(c=='ai')lastAiText=t;saveHistory();return d}
          fIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block';updateEdit()};r.readAsDataURL(f)}
          function setF(f){currentFilter=f;updateEdit()}
          function updateEdit(){let b=document.getElementById('bright').value;let c=document.getElementById('contrast').value;let s=document.getElementById('satur').value;document.getElementById('bVal').textContent=b;document.getElementById('cVal').textContent=c;document.getElementById('sVal').textContent=s;let filter=currentFilter;if(filter=='none')filter='';preview.style.filter=filter+' brightness('+b+'%) contrast('+c+'%) saturate('+s+'%)';}
          function dwn(){if(!preview.src||preview.style.display=='none')return alert('ছবি নাই!');let a=document.createElement('a');a.href=preview.src;a.download='sadi-v10-'+Date.now()+'.jpg';a.click()}
          function shareImg(){if(!preview.src)return alert('ছবি নাই!');if(navigator.share){navigator.share({title:'Sadi V10',text:'Made by SADI DEVELOPER',url:preview.src})}else{alert('Link: '+preview.src)}}
          function quick(t){pmt.value=t;gen()}
          function showTimer(s){timer.style.display='block';let c=s;let it=setInterval(()=>{timer.textContent='⏳ '+c+'s Wait...';c--;if(c<0){clearInterval(it);timer.style.display='none'}},1000)}
          async function gen(){let raw=(pmt.value.trim()||inp.value.trim()||'');if(!raw)return alert('লিখো!');let low=raw.toLowerCase();let now=Date.now(),diff=(now-lastImgTime)/1000;if(diff<46 && !low.includes('cat') && !low.includes('biral')){showTimer(Math.ceil(46-diff));return alert('45s Wait! Cat Unlimited!')}
          lastImgTime=now;addM('🎨 '+raw,'user');let finalPrompt=raw;if(low.includes('free fire')||low.includes('ফ্রী ফায়ার')||low.includes('ff')||low.includes('freefire')){finalPrompt='Garena Free Fire battle royale character, hip hop bundle, holding MP40 gun, gloo wall background, anime gaming style, ultra detailed, 8k, cinematic, '+raw.replace(/free fire/gi,'')}let ty=addM('✨ Generating Perfect Image...','ai');if(low.includes('বিড়াল')||low.includes('cat')||low.includes('biral')){preview.src='https://cataas.com/cat?'+Date.now()}else{preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(finalPrompt)+'?seed='+Math.floor(Math.random()*999999)+'&width=1024&height=1024&nologo=true&model=flux'}preview.style.display='block';updateEdit();sI();ty.textContent='✅ V10 Mega Ready! এখন Edit করে HD Download দাও!'}
          async function ask(q){q=q||inp.value.trim();if(!q)return;addM(q,'user');inp.value='';let ty=addM('Sadi ভাবছে...','ai');try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q));let t=await r.text();ty.textContent=t;lastAiText=t;let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';speechSynthesis.speak(u);saveHistory()}catch(e){ty.textContent='আমি Sadi V10 Mega!'}};snd.onclick=()=>ask();inp.onkeypress=e=>{if(e.key==='Enter')ask()}
          function speakLast(){let u=new SpeechSynthesisUtterance(lastAiText);u.lang='bn-BD';speechSynthesis.speak(u)}function stopS(){speechSynthesis.cancel()}
          function clearHistory(){localStorage.removeItem('sadi_v10_history');chat.innerHTML='<div class="msg ai">History Cleared! New Chat Start!</div>';}
          function startV(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Chrome ব্যবহার করো');let r=new SR();r.lang='bn-BD';r.onstart=()=>{vStatus.textContent='🎤 শুনছি... বলো ভাই!';micBtn.textContent='🔴'};r.onresult=e=>{let t=e.results[0][0].transcript;inp.value=t;pmt.value=t;vStatus.textContent='✅ '+t;ask(t)};r.onend=()=>{micBtn.textContent='🎤';vStatus.textContent='Ready...'};r.start()}micBtn.onclick=startV;
          </script></body></html>
          HTMLEND
          echo '{"appId":"com.myaisadi.app","appName":"My AI Sadi V10 Mega","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: My-AI-Sadi-V10-Mega-10-Future
          path: android/app/build/outputs/apk/debug/app-debug.apk
