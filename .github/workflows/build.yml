name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          rm -rf android www node_modules package-lock.json
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          mkdir -p www
          echo "<html><body><h1>My AI Sadi</h1></body></html>" > www/index.html
          echo '{"appId":"com.myaisadi.app","appName":"My AI Sadi","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
