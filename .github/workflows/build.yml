name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Clean
        run: rm -rf android www node_modules package-lock.json

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create App Files
        run: |
          mkdir -p www
          echo '{"appId":"com.myaisadi.app","appName":"SADI AI","webDir":"www"}' > capacitor.config.json
          node -e "
          const fs=require('fs');
          const html=\`<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>SADI AI</title><style>body{margin:0;font-family:sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}#splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}#logo{width:120px;height:120px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:60px}#logoText{margin-top:15px;font-size:30px;font-weight:900;letter-spacing:5px}.header{background:#151515;padding:10px;display:flex;justify-content:space-between;font-size:11px;border-bottom:1px solid #222}.active{background:#667eea;padding:6px 12px;border-radius:15px}#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 14px;border-radius:16px;max-width:80%;font-size:14px;line-height:1.6;white-space:pre-wrap}.user{background:linear-gradient(135deg,#667eea,#764ba2);align-self:flex-end}.ai{background:#1e1e1e;border:1px solid #333;align-self:flex-start}.input-area{display:flex;padding:10px;background:#151515;gap:7px;border-top:1px solid #222}#inp{flex:1;padding:12px 16px;border-radius:22px;background:#222;color:#fff;border:1px solid #333;outline:none}#sendBtn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;width:40px;height:40px;border-radius:50%}</style></head><body>
          <div id='splash'><div id='logo'>🤖</div><div id='logoText'>SADI AI</div><div style='margin-top:8px;font-size:12px;opacity:.7;letter-spacing:3px'>My AI • Sadi - MEGA BRAIN 160MB</div><div style='margin-top:20px;font-size:10px;opacity:.5'>Loading...</div></div>
          <div class='header'><div><span class='active'>💬 CHAT</span> <span>🎮 GAMES</span></div><div><button onclick='localStorage.clear();location.reload()' style='background:#222;color:#fff;border:none;padding:4px 8px;border-radius:6px'>🗑️</button></div></div>
          <div id='chat'></div>
          <div class='input-area'><input id='inp' placeholder='যা খুশি জিজ্ঞাসা করো... সব পারি!'><button id='sendBtn'>➤</button></div>
          <script>
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),sendBtn=document.getElementById('sendBtn');
          function addM(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;let wrap=document.createElement('div');wrap.style.display='flex';wrap.style.flexDirection='column';wrap.style.alignItems=c==='user'?'flex-end':'flex-start';wrap.appendChild(d);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;localStorage.setItem('chat',chat.innerHTML);}
          function initChat(){addM('কেমন আছো? আমি AI, কোনো help লাগলে বলো! ❤️\\n\\n🧠 MEGA BRAIN 160MB!\\nযা জিজ্ঞাসা করবে সব পারি!\\n\\n🇧🇩 Bangladesh, 🌍 World, 🎮 Games, 🧮 Math','ai')}
          let saved=localStorage.getItem('chat'); if(saved&&saved.length>50){chat.innerHTML=saved;}else{initChat();}
          function getAns(q){
            let low=q.toLowerCase().trim();
            if(low.includes('tomar nam ki')||low.includes('who are you')) return 'আমার নাম SADI AI! 🤖 MEGA BRAIN 160MB! SADI DEVELOPER এর বানানো AI! My AI • Sadi!';
            if(low.includes('kemon acho')) return 'আলহামদুলিল্লাহ ভালো আছি! 😊 তুমি কেমন আছো? আমি SADI AI, help লাগলে বলো! ❤️';
            if(low.includes('bangladesh koy namber')) return '🇧🇩 বাংলাদেশ 92 তম বৃহত্তম দেশ (1,47,570 বর্গ কিমি), জনসংখ্যায় 8ম (17 কোটি+), রাজধানী ঢাকা, মুদ্রা টাকা, স্বাধীনতা 1971';
            if(low.includes('rajdhani')) return '🏛️ বাংলাদেশের রাজধানী: ঢাকা! জনসংখ্যা 2.2 কোটি, প্রতিষ্ঠা 1608!';
            if(low.includes('chobi edit')) return 'হ্যাঁ ভাই, ছবি Edit পারি! 🎨 B&W, HD Pro!';
            if(low.includes('ludo')) return '🏆 Ludo Trick: Safe Zone ★ এ থাকো, একটা Token Home এর কাছে নাও, প্রতিপক্ষ Home এর কাছে গেলে কেটে দাও!';
            if(low.includes('free fire')||low.includes('ff')) return '🔥 FF Rank: Alok+Jota+Kelly+Hayato, MP40+M1887, Bermuda Edge, Gloo 200+';
            if(low.includes('2+2')) return '🧮 উত্তর: 2+2 = 4';
            if(low==='hi'||low==='hello'||low.includes('হ্যালো')) return 'কেমন আছো? আমি AI, কোনো help লাগলে বলো! ❤️ 👋 হ্যালো ভাই! MEGA BRAIN 160MB!';
            return '🧠 MEGA BRAIN 160MB\\n\\nতোমার প্রশ্ন: \\''+q+'\\'\\n\\nআমি সব জানি! 🇧🇩 BD, 🌍 World, 🎮 Games, 🧮 Math\\nDetails এ লিখো, সঠিক উত্তর দেবো!';
          }
          async function ask(){
            let q=inp.value.trim(); if(!q) return; addM(q,'user'); inp.value=''; 
            let ty=document.createElement('div'); ty.className='msg ai'; ty.textContent='...'; chat.appendChild(ty);
            let ans=getAns(q);
            setTimeout(async()=>{
              ty.remove();
              try{
                let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent('You are SADI AI MEGA BRAIN, made by SADI DEVELOPER. Answer in Bangla short. User: '+q),{signal: AbortSignal.timeout(5000)});
                if(r.ok){let t=await r.text(); if(t&&t.length>20&&t.length<3000&&!t.includes('503')){addM(t,'ai'); return;}}
              }catch(e){}
              addM(ans,'ai');
            },600);
          }
          sendBtn.onclick=ask; inp.onkeypress=e=>{if(e.key==='Enter')ask()};
          setTimeout(()=>{document.getElementById('splash').style.display='none'},2500);
          </script></body></html>\`;
          fs.writeFileSync('www/index.html', html);
          console.log('HTML created!');
          "

      - name: Build APK
        run: |
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADI-AI-V34-WORKING
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
