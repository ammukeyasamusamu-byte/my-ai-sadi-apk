name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build SADI AI V26 All Fix
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          if [ -f "icon.png" ]; then cp icon.png www/icon.png; fi
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SADI AI</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}#splash{position:fixed;inset:0;background:radial-gradient(circle at center,#667eea 0%,#000 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;animation:fadeOut .6s 3s forwards}#logoImg{width:130px;height:130px;border-radius:28px;box-shadow:0 10px 40px rgba(102,126,234,.6);animation:pop 1s infinite alternate;object-fit:cover;background:#fff}@keyframes pop{to{transform:scale(1.08)}}@keyframes fadeOut{to{opacity:0;visibility:hidden}}#logoText{margin-top:18px;font-size:34px;font-weight:900;letter-spacing:6px}#appSub{margin-top:4px;font-size:12px;opacity:.8;letter-spacing:3px}.loading{margin-top:18px;width:160px;height:4px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}.bar{height:100%;width:0%;background:#fff;animation:load 2.8s forwards}@keyframes load{to{width:100%}}.header{background:#151515;padding:10px;display:flex;justify-content:space-around;font-weight:700;font-size:10px;border-bottom:1px solid #222}.active{background:#667eea!important;color:#fff!important;border-radius:20px;padding:6px 12px}#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.msg{padding:13px 16px;border-radius:18px;max-width:82%;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;animation:slide .25s}.user{background:linear-gradient(135deg,#667eea,#764ba2);align-self:flex-end;border-bottom-right-radius:6px}.ai{background:#1e1e1e;border:1px solid #2a2a2a;align-self:flex-start;border-bottom-left-radius:6px}.time{font-size:9px;opacity:.4;margin-top:4px}.typing{display:flex;gap:4px;padding:14px 18px;background:#1e1e1e;border-radius:18px;width:fit-content}.dot{width:6px;height:6px;background:#667eea;border-radius:50%;animation:bounce 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}#gameTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px}.card{background:#1a1a1a;padding:14px;border-radius:16px;border:1px solid #2a2a2a}.chip{display:inline-block;padding:8px 12px;margin:4px;background:#222;border:1px solid #333;border-radius:20px;font-size:12px;cursor:pointer}.input-area{display:flex;align-items:center;padding:10px 12px;background:#151515;gap:8px;border-top:1px solid #222}#inp{flex:1;padding:13px 18px;border-radius:26px;background:#222;color:#fff;border:1px solid #333;outline:none;font-size:14px}#sendBtn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}img#preview{max-width:100%;border-radius:12px;margin-top:8px}.btn{width:100%;padding:13px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:8px}</style></head><body>
          <div id="splash"><img id="logoImg" src="icon.png" onerror="this.innerHTML='🤖';this.style.display='flex';this.style.alignItems='center';this.style.justifyContent='center';this.style.fontSize='60px'"><div id="logoText">SADI AI</div><div id="appSub">My AI • Sadi</div><div class="loading"><div class="bar"></div></div></div>
          <div class="header"><span id="tC" class="active" onclick="sC()">💬 CHAT</span><span id="tG" onclick="sG()">🎮 GAMES</span><span id="tI" onclick="sI()">🎨 EDIT</span></div>
          <div id="chat"></div>
          <div id="gameTab"><div class="card" style="background:linear-gradient(135deg,#ffeb3b 0%,#ff9800 100%);color:#000"><h3>🎲 লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো!</h3><div style="margin-top:10px"><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Ludo Star জেতার trick')">🏆 জেতার Trick</span><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Ludo 6 trick')">🎲 6 Trick</span><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Safe zone trick')">🛡️ Safe</span></div></div><div class="card"><h3>🎮 All Games</h3><div style="margin-top:8px"><span class="chip" onclick="askChip('Free Fire rank push')">🔥 FF Rank</span><span class="chip" onclick="askChip('Free Fire headshot')">🎯 Headshot</span><span class="chip" onclick="askChip('PUBG sensitivity')">🔫 PUBG Sensitivity</span><span class="chip" onclick="askChip('Tomar nam ki')">🤖 Tomar nam ki?</span><span class="chip" onclick="askChip('Tumi chobi edit korte paro?')">🎨 Chobi Edit?</span></div></div><div class="card"><b>🎨 Image Generate</b><br><input id="pmt" style="width:100%;padding:11px;margin-top:8px;border-radius:10px;background:#222;color:#fff;border:1px solid #333" placeholder="যেমন: ludo star"><img id="preview" style="display:none"><button class="btn" onclick="gen()">✨ Image বানাও</button><button class="btn" style="background:#222" onclick="dwn()">⬇️ Download</button></div></div>
          <div id="imageTab" style="display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px"><div class="card"><b>📸 Photo Edit Pro - SADI AI</b><br><input type="file" id="fIn" accept="image/*"><div style="margin-top:8px;display:flex;flex-wrap:wrap"><button class="sbtn" style="padding:8px 12px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;margin:3px;font-size:11px" onclick="setF('none')">Original</button><button class="sbtn" style="padding:8px 12px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;margin:3px;font-size:11px" onclick="setF('grayscale(100%)')">B&W</button><button class="sbtn" style="padding:8px 12px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;margin:3px;font-size:11px" onclick="setF('contrast(150%) brightness(110%)')">HD Pro</button><button class="sbtn" style="padding:8px 12px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;margin:3px;font-size:11px" onclick="setF('sepia(100%)')">Sepia</button></div><p style="font-size:11px;opacity:.6;margin-top:10px">👆 উপরে ছবি Upload করো, তারপর Filter লাগাও আর Download করো!</p><img id="preview2" style="max-width:100%;border-radius:12px;margin-top:8px;display:none"></div></div>
          <div class="input-area"><span onclick="startV()" style="font-size:22px;cursor:pointer">🎤</span><input id="inp" placeholder="লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো..."><button id="sendBtn">➤</button></div>
          <div style="background:#000;color:#667eea;padding:7px;text-align:center;font-weight:900;font-size:9px;letter-spacing:3px">SADI AI - My AI • Sadi - V26</div>
          <script>
          setTimeout(()=>{document.getElementById('splash').style.display='none'},3000);
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),sendBtn=document.getElementById('sendBtn'),preview=document.getElementById('preview'),preview2=document.getElementById('preview2'),fIn=document.getElementById('fIn'),pmt=document.getElementById('pmt');
          let lastImgTime=0;
          function getTime(){return new Date().toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit'})}
          function sC(){chat.style.display='flex';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='none';document.getElementById('tC').classList.add('active');document.getElementById('tG').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sG(){chat.style.display='none';document.getElementById('gameTab').style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('tG').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sI(){chat.style.display='none';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('tI').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tG').classList.remove('active')}
          function addM(t,c){let wrap=document.createElement('div');wrap.style.display='flex';wrap.style.flexDirection='column';wrap.style.alignItems=c==='user'?'flex-end':'flex-start';let d=document.createElement('div');d.className='msg '+c;d.textContent=t;let tm=document.createElement('span');tm.className='time';tm.textContent=getTime();wrap.appendChild(d);wrap.appendChild(tm);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;sC();return d}
          function showTyping(){let w=document.createElement('div');w.id='typing';w.className='typing';w.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';chat.appendChild(w);chat.scrollTop=chat.scrollHeight;return w}
          function initChat(){
            addM("কেমন আছো? আমি AI, কোনো help লাগলে বলো! ❤️\n\n🎮 আমি সব গেমের ব্যাপারে হেল্প করতে পারি!\n🎨 ছবি Edit ও করতে পারি!\n\n🎲 লুডু, 🔥 Free Fire, 🔫 PUBG - যেটা লাগবে বলো!", "ai");
          }
          initChat();
          fIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block';preview2.src=r.result;preview2.style.display='block';sI()};r.readAsDataURL(f)}
          function setF(f){if(preview) preview.style.filter=f; if(preview2) preview2.style.filter=f;}
          function dwn(){let img=preview2.style.display!=='none'?preview2:preview; if(!img.src||img.style.display==='none') return alert('আগে ছবি Upload করো!'); let a=document.createElement('a');a.href=img.src;a.download='sadi-ai-edit.jpg';a.click();}
          function askChip(q){inp.value=q;ask()}
          async function gen(){let raw=(pmt.value.trim()||'');if(!raw)return alert('লিখো!');let now=Date.now(),diff=(now-lastImgTime)/1000;if(diff<46){return alert('45s Wait!')}lastImgTime=now;addM('🎨 '+raw,'user');let ty=showTyping();preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(raw)+'?seed='+Date.now()+'&width=768&height=768&nologo=true&model=flux';preview.style.display='block';sG();setTimeout(()=>{ty.remove()},1200);}
          function getCorrectAnswer(q){
            let low=q.toLowerCase().trim();
            // PRIORITY 1: IDENTITY - Must be first!
            if(low.includes('tomar nam ki')||low.includes('tumar nam ki')||low.includes('name ki')||low==='tomar nam'||low.includes('who are you')||low.includes('tumi ke')||low.includes('apnar nam')||low.includes('what is your name')){
              return "আমার নাম SADI AI! 🤖\n\nআমি SADI DEVELOPER এর বানানো AI! My AI • Sadi Logo টা আমার!\n\nআমি তোমার গেমিং বন্ধু, সব গেমের হেল্প করবো! বলো কি help লাগবে?";
            }
            if(low.includes('ke banaiche')||low.includes('banayeche ke')||low.includes('who made you')||low.includes('creator')||low.includes('developer ke')||low.includes('tmk ke banaise')){
              return "আমাকে বানাইছে SADI DEVELOPER! 👨‍💻🔥\n\nউনি একজন Pro Developer! এই SADI AI App টা উনি তোমাদের জন্য বানাইছে!\n\nMy AI • Sadi - এই Logo টা উনার Design!";
            }
            // PRIORITY 2: HOW ARE YOU
            if(low.includes('kemon acho')||low.includes('kemon aco')||low.includes('kemon aso')||low.includes('how are you')||low.includes('kemon achen')||low.includes('kemon acho tumi')){
              return "আলহামদুলিল্লাহ অনেক ভালো আছি ভাই! 😊 তুমি কেমন আছো?\n\nআমি SADI AI, তোমার জন্য সবসময় রেডি! কোনো help লাগলে বলো! ❤️\n\n🎮 Ludo, Free Fire, PUBG নিয়ে হেল্প লাগবে?";
            }
            // PRIORITY 3: PHOTO EDIT - Important fix!
            if(low.includes('chobi edit')||low.includes('ছবি এডিট')||low.includes('photo edit')||low.includes('ছবি ইডিট')||low.includes('edit korte paro')||low.includes('pic edit')){
              return "হ্যাঁ ভাই, আমি ছবি Edit করতে পারি! 🎨✅\n\n📸 কি কি পারি:\n1. B&W - সাদা কালো\n2. HD Pro - ছবি Clear / HD\n3. Sepia - পুরোনো দিনের Look\n4. Image Generate - Ludo, Free Fire এর ছবি বানাই\n\n👉 নিচে EDIT Button এ ক্লিক করো, তারপর ছবি Upload করো!\n\nআর Games Tab এ গেলে Image Generate ও করতে পারবে!";
            }
            // PRIORITY 4: GREETINGS
            if(low==='hi'||low==='hello'||low==='hey'||low==='hlw'||low==='hlo'||low.includes('হ্যালো')||low.includes('হাই')||low==='salam'||low.includes('assalam')){
              return "কেমন আছো? আমি AI, কোনো help লাগলে বলো! ❤️\n\n👋 হ্যালো ভাই!\n\n🎮 আমি Ludo, Free Fire, PUBG, Roblox - সব গেমের Pro Tips দেবো!\n🎨 ছবি Edit ও করতে পারি!\n\nবলো কি help লাগবে?";
            }
            if(low.includes('ei to valo')||low.includes('valoi')||low.includes('valo achi')||low.includes('vlo achi')||low.includes('alhamdulillah')){
              return "মাশাল্লাহ! শুনে অনেক ভালো লাগলো! 😍\n\nবলো ভাই, কোন গেম নিয়ে help লাগবে? নাকি ছবি Edit করবে?\n\n🎲 Ludo, 🔥 Free Fire, 🔫 PUBG - যেটা লাগবে বলো!";
            }
            if(low.includes('thank')||low.includes('ধন্যবাদ')||low.includes('thanks')||low.includes('tnx')||low.includes('dhonnobad')){
              return "Welcome ভাই! ❤️ সবসময় হেল্প করতে রেডি আছি!\n\nআরো কোনো help লাগলে বলো! 🎮";
            }
            if(low.includes('ki koro')||low.includes('what do you do')||low.includes('kaj ki')||low.includes('ki paro')||low.includes('tumi ki ki paro')){
              return "আমি অনেক কিছু পারি ভাই! 😊\n\n🎮 Games:\n• Ludo Star - জেতার Trick, 6 Trick, Safe Zone, Coin Trick\n• Free Fire - Rank Push, Headshot, Sensitivity\n• PUBG - Sensitivity Code, Conqueror Trick\n• Roblox - Free Robux\n• Carrom - Direct Shot\n\n🎨 Photo:\n• ছবি Edit - B&W, HD Pro, Sepia\n• Image Generate - Ludo, FF, PUBG ছবি বানাই\n\nবলো কোনটা লাগবে?";
            }
            // LUDO - Detailed
            if(low.includes('ludo')||low.includes('লুডু')){
              if(low.includes('6')||low.includes('ছয়')||low.includes('six')){return "🎲 Ludo তে 6 আনার Pro Trick:\n\n1. 🎯 একটা Token Home এর কাছে নাও, বারবার একই Token নাড়াও না\n2. 🛡️ Safe Zone এ থাকো\n3. 🔄 6 পাইলে নতুন Token না বের করে পুরোনো Token আগাও\n4. 💡 Dice টা মাঝখানে জোরে Tap করো\n5. 🏆 সব Token একসাথে বের করো না\n\nTry করো, 6 বেশি আসবে!"}
              if(low.includes('coin')||low.includes('কয়েন')){return "💰 Ludo Star Free Coin Trick:\n\n1. 🎁 Daily Bonus - প্রতিদিন Login\n2. 🎮 Facebook Invite - 500+ Coin\n3. 🏆 Tournament - 10k+ Coin\n4. 📺 Video Ad - Shop এ Video দেখো\n5. Low Bet Table এ খেলো প্রথমে!"}
              if(low.includes('safe')){return "🛡️ Ludo Safe Zone Trick:\n\nStar ★ চিহ্নিত ঘর Safe! ওখানে কেউ কাটতে পারবে না!\n\n1. 8 টা Safe Zone আছে\n2. সবসময় Safe Zone এ থাকো\n3. 2 টা Token একই Safe Zone এ রাখলে Super Safe\n4. Home এর আগের Safe Zone সবচেয়ে Important!"}
              return "🏆 Ludo Star জেতার 100% Trick:\n\n1. 🛡️ Safe Zone: Star ★ ঘরে থাকো, কেউ কাটতে পারবে না!\n2. 🎲 Token: একটা Home এর কাছে নাও, তারপর 2nd বের করো\n3. ⚔️ কখন মারবে: প্রতিপক্ষ Home এর কাছে গেলে কেটে দাও\n4. 🎯 6 পাইলে আগের Token আগাও!\n5. 💰 ছোট Table (1k-10k) এ খেলো!\n\nFollow করো, জিতবে!"}
            if(low.includes('free fire')||low.includes('ff')||low.includes('ফ্রি ফায়ার')){
              if(low.includes('headshot')){return "🎯 Free Fire Headshot Trick:\n\nSensitivity: General 95, Red Dot 85, 2x 75\nAim মাথার লেভেলে রাখো\nDrag Trick: Fire Button উপরে Drag করো\nCharacter: Hayato + Kelly + Moco + Jota\nGun: MP40, M1887, Desert Eagle best!"}
              return "🔥 Free Fire Rank Push - Heroic Trick:\n\nCharacter: Alok + Jota + Kelly + Hayato\nGun: MP40 + M1887\nMap: Bermuda, Edge এ থাকো\nStrategy: Loot > 3rd Party Kill\nGloo 200+ রাখো\nTime: রাত 10PM-2AM best!"}
            if(low.includes('pubg')||low.includes('পাবজি')){
              if(low.includes('sensitivity')){return "🔫 PUBG Best Sensitivity:\n\nCamera TPP 95%, Red Dot 55%, 3x 25%, 6x 18%\nCode: 7307-1085-6788-4282-435\nRecoil: Thumb নিচে টানো + Gyro!"}
              return "🏆 PUBG Conqueror Trick:\n\nMap: Erangel Classic\nGun: M416 + UMP\n10+ Match Daily, Top 10\nFixed Squad, KD 4+ রাখো!"}
            if(low.includes('roblox')){return "🧱 Roblox Free Robux (Legal):\n\n1. Microsoft Rewards - Bing Search\n2. Premium Monthly\n3. Game Pass / T-Shirt Sell\n4. Please Donate Game\n\nFake Generator সব Scam!"}
            if(low.includes('carrom')){return "🎯 Carrom Direct Shot:\n\nStriker মাঝখানে রাখো\nPower 70-80%\n45 Degree Angle Best\nQueen এর পিছনে মারো!"}
            return "কেমন আছো? আমি AI, কোনো help লাগলে বলো! ❤️\n\n🎮 Ludo, 🔥 Free Fire, 🔫 PUBG, 🧱 Roblox, 🎯 Carrom - সব গেমের Pro Tips দেবো!\n🎨 ছবি Edit ও করতে পারি!\n\nবলো কোনটা নিয়ে help লাগবে? 👇";
          }
          async function ask(q){q=q||inp.value.trim();if(!q)return;addM(q,'user');inp.value='';let typingEl=showTyping();let correctAns=getCorrectAnswer(q);setTimeout(()=>{typingEl.remove();addM(correctAns,'ai');},500);}
          sendBtn.onclick=()=>ask();inp.onkeypress=e=>{if(e.key==='Enter')ask()}
          function startV(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Chrome ব্যবহার করো');let r=new SR();r.lang='bn-BD';r.onresult=e=>{inp.value=e.results[0][0].transcript;ask()};r.start()}
          </script></body></html>
          HTMLEND
          echo '{"appId":"com.myaisadi.app","appName":"SADI AI","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          if [ -f "../icon.png" ]; then
            mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
            cp ../icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
