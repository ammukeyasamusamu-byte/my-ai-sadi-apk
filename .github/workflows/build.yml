name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build V12 All Games
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadi V12 All Games</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column}#splash{position:fixed;inset:0;background:linear-gradient(135deg,#ff5722,#ffeb3b,#2196f3);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;animation:fadeOut .5s 3s forwards}#logo{width:120px;height:120px;background:#fff;border-radius:25px;display:flex;align-items:center;justify-content:center;font-size:60px;animation:pop 1s infinite alternate}@keyframes pop{to{transform:scale(1.15) rotate(5deg)}}@keyframes fadeOut{to{opacity:0;visibility:hidden}}#logoText{margin-top:15px;font-size:28px;font-weight:900;letter-spacing:3px;color:#000}.loading{margin-top:15px;width:160px;height:4px;background:rgba(0,0,0,.2);border-radius:10px;overflow:hidden}.bar{height:100%;width:0%;background:#000;animation:load 2.8s forwards}@keyframes load{to{width:100%}}.header{background:#111;padding:8px;display:flex;justify-content:space-around;font-weight:bold;font-size:9px;border-bottom:1px solid #222}.active{background:#ff5722!important;color:#fff!important;border-radius:20px;padding:5px 8px}#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 14px;border-radius:14px;max-width:85%;font-size:13px;white-space:pre-wrap}.user{background:#ff5722;align-self:flex-end}.ai{background:#1e1e1e;border:1px solid #333;align-self:flex-start}#gameTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px}.card{background:#1a1a1a;padding:12px;border-radius:12px;border:1px solid #2a2a2a}img#preview{max-width:100%;border-radius:10px;margin-top:8px}.btn{width:100%;padding:12px;background:#ff5722;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:6px}.sbtn{padding:7px 10px;border:none;border-radius:8px;background:#2a2a2a;color:#fff;margin:3px;font-size:11px}.input-area{display:flex;padding:10px;background:#111;gap:6px}#inp{flex:1;padding:12px;border-radius:25px;background:#222;color:#fff;border:1px solid #333}</style></head><body>
          <div id="splash"><div id="logo">🎲</div><div id="logoText">SADI ALL GAMES</div><div style="font-size:10px;color:#000;letter-spacing:3px;font-weight:bold">LUDO | FF | PUBG | ROBLOX</div><div class="loading"><div class="bar"></div></div></div>
          <div class="header"><span id="tC" class="active" onclick="sC()">💬 Chat</span><span id="tG" onclick="sG()">🎮 All Games</span><span id="tI" onclick="sI()">🎨 Edit</span></div>
          <div id="chat"><div class="msg ai">🎲 I am Sadi V12 ALL GAMES EXPERT by SADI DEVELOPER!
          আমি সব Game এর বাপ!
          🎲 Ludo Star / Ludo King: কিভাবে জিতবে, 6 আনার trick, safe zone
          🔥 Free Fire: Rank Push, Headshot
          🔫 PUBG: Sensitivity
          🧱 Roblox: Robux
          🎯 Carrom Pool: Direct shot trick
          জিজ্ঞাসা করো ভাই!</div></div>
          <div id="gameTab">
            <div class="card" style="background:linear-gradient(135deg,#ffeb3b,#ff9800);color:#000"><h3>🎲 Ludo Star Expert Zone</h3><div style="display:flex;flex-wrap:wrap;margin-top:8px"><button class="sbtn" style="background:#000;color:#ffeb3b" onclick="askGame('Ludo Star এ কিভাবে জিতবো? সবসময় জেতার trick দাও')">🏆 Ludo জেতার Trick</button><button class="sbtn" style="background:#000;color:#ffeb3b" onclick="askGame('Ludo Star এ 6 কিভাবে আনবো বেশি? কোন trick আছে?')">🎲 6 আনার Trick</button><button class="sbtn" style="background:#000;color:#ffeb3b" onclick="askGame('Ludo King এ token কিভাবে safe রাখবো? কখন মারবো?')">🛡️ Safe Zone Trick</button><button class="sbtn" style="background:#000;color:#ffeb3b" onclick="askGame('Ludo Star এ coin কিভাবে বাড়াবো? free coin trick?')">💰 Free Coin</button></div></div>
            <div class="card" style="background:linear-gradient(135deg,#ff5722,#000)"><h3>🔥 Other Games</h3><div style="display:flex;flex-wrap:wrap;margin-top:8px"><button class="sbtn" style="background:#ff5722" onclick="askGame('Free Fire rank push trick')">🔥 FF Rank</button><button class="sbtn" style="background:#ff9800;color:#000" onclick="askGame('PUBG sensitivity code')">🔫 PUBG</button><button class="sbtn" style="background:#00bcd4" onclick="askGame('Roblox free robux')">🧱 Roblox</button><button class="sbtn" style="background:#4caf50" onclick="askGame('Carrom Pool এ কিভাবে direct shot মারবো?')">🎯 Carrom</button></div></div>
            <div class="card"><b>🎨 Game Image Generate:</b><br><input id="pmt" style="width:100%;padding:10px;margin-top:6px;border-radius:8px;background:#222;color:#fff;border:1px solid #444" placeholder="যেমন: ludo star, free fire, pubg"><div style="display:flex;flex-wrap:wrap;margin-top:6px"><button class="sbtn" style="background:#ffeb3b;color:#000" onclick="quick('ludo star game board, colorful dice, fun')">🎲 Ludo Star</button><button class="sbtn" style="background:#ff5722" onclick="quick('free fire character')">🔥 Free Fire</button><button class="sbtn" style="background:#ff9800;color:#000" onclick="quick('pubg mobile character')">🔫 PUBG</button><button class="sbtn" style="background:#00bcd4" onclick="quick('roblox avatar')">🧱 Roblox</button></div><img id="preview" style="display:none"><button class="btn" onclick="gen()">✨ Image বানাও</button><button class="btn" style="background:#fff;color:#000" onclick="dwn()">⬇️ Download</button></div>
          </div>
          <div id="imageTab" style="display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px"><div class="card"><b>📸 Photo Edit:</b><br><input type="file" id="fIn" accept="image/*"><div style="margin-top:6px;display:flex;flex-wrap:wrap"><button class="sbtn" onclick="setF('none')">Original</button><button class="sbtn" onclick="setF('grayscale(100%)')">B&W</button><button class="sbtn" onclick="setF('contrast(150%) brightness(110%)')">HD</button></div></div></div>
          <div class="input-area"><span onclick="startV()" style="font-size:20px;cursor:pointer">🎤</span><input id="inp" placeholder="যেমন: Ludo Star জেতার trick দাও..."><button id="snd" style="background:#ff5722;color:#fff;border:none;padding:10px 16px;border-radius:20px;font-weight:bold">SEND</button></div>
          <div style="background:#000;color:#ffeb3b;padding:5px;text-align:center;font-weight:900;font-size:9px;letter-spacing:2px">SADI DEVELOPER - V12 ALL GAMES - LUDO STAR SPECIAL</div>
          <script>
          setTimeout(()=>{document.getElementById('splash').style.display='none'},3000);
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),snd=document.getElementById('snd'),preview=document.getElementById('preview'),fIn=document.getElementById('fIn'),pmt=document.getElementById('pmt');
          let lastImgTime=0,currentFilter='none';
          function sC(){chat.style.display='flex';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='none';document.getElementById('tC').classList.add('active');document.getElementById('tG').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sG(){chat.style.display='none';document.getElementById('gameTab').style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('tG').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sI(){chat.style.display='none';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('tI').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tG').classList.remove('active')}
          function addM(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;sC();return d}
          fIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)}
          function setF(f){preview.style.filter=f}
          function dwn(){if(!preview.src)return alert('ছবি নাই!');let a=document.createElement('a');a.href=preview.src;a.download='sadi-gaming.jpg';a.click()}
          function quick(t){pmt.value=t;gen()}
          async function gen(){let raw=(pmt.value.trim()||inp.value.trim()||'');if(!raw)return alert('লিখো!');let low=raw.toLowerCase();let now=Date.now(),diff=(now-lastImgTime)/1000;if(diff<46 && !low.includes('cat')){return alert('45s Wait!')}
          lastImgTime=now;addM('🎨 '+raw,'user');let finalPrompt=raw;if(low.includes('ludo')){finalPrompt='Ludo star game board, colorful ludo dice 6, 4 tokens red blue green yellow, fun board game, vibrant, 8k, '+raw} else if(low.includes('free fire')||low.includes('ff')){finalPrompt='Garena Free Fire character, 8k, '+raw} else if(low.includes('pubg')){finalPrompt='PUBG Mobile character, m416, 8k, '+raw} else if(low.includes('roblox')){finalPrompt='Roblox avatar blocky, 8k, '+raw} let ty=addM('✨ Generating '+raw+'...','ai');preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(finalPrompt)+'?seed='+Date.now()+'&width=768&height=768&nologo=true&model=flux';preview.style.display='block';sG();}
          function askGame(q){inp.value=q;ask(q)}
          async function ask(q){q=q||inp.value.trim();if(!q)return;addM(q,'user');inp.value='';let ty=addM('🎲 Expert ভাবছে...','ai');let expertPrompt='You are SADI All Games Expert, pro player of Ludo Star, Ludo King, Free Fire, PUBG Mobile, Roblox, Carrom Pool. User is Bangladeshi, speaks Bangla mix. Explain Ludo tricks: safe zones, when to cut, how to get 6, coin management. For Free Fire/PUBG/Roblox give pro tips. Answer in fun Bangla mixed English like friend. User question: '+q;try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(expertPrompt));let t=await r.text();ty.textContent=t}catch(e){ty.textContent='🎲 আমি All Games Expert! Ludo Star, FF, PUBG, Roblox সব পারি! আবার প্রশ্ন করো ভাই!'}}
          snd.onclick=()=>ask();inp.onkeypress=e=>{if(e.key==='Enter')ask()}
          function startV(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Chrome ব্যবহার করো');let r=new SR();r.lang='bn-BD';r.onresult=e=>{inp.value=e.results[0][0].transcript;ask()};r.start()}
          </script></body></html>
          HTMLEND
          echo '{"appId":"com.myaisadi.app","appName":"Sadi All Games V12","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Sadi-V12-All-Games-Ludo-Star-FF-PUBG-Roblox
          path: android/app/build/outputs/apk/debug/app-debug.apk
