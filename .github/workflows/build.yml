name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build V3 Fixed APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My AI Sadi V3</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#eef2ff;height:100vh;display:flex;flex-direction:column}.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:12px;text-align:center;font-weight:bold;font-size:18px;display:flex;justify-content:space-around}.header span{cursor:pointer;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.2)}.header .active{background:#fff;color:#764ba2}#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}.msg{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.4;word-break:break-word;white-space:pre-wrap}.user{background:#667eea;color:#fff;align-self:flex-end}.ai{background:#fff;color:#333;align-self:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.1)}.input-area{display:flex;padding:12px;background:#fff;gap:8px}#input{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #ddd;outline:none}#send{background:#667eea;color:#fff;border:none;padding:0 22px;border-radius:25px;font-weight:bold}#imageTab{display:none;flex:1;overflow-y:auto;padding:15px;flex-direction:column;gap:12px}.img-card{background:#fff;padding:12px;border-radius:12px}.img-card input,.img-card button{width:100%;margin-top:8px;padding:12px;border-radius:8px;border:1px solid #ddd}.img-card button{background:#667eea;color:#fff;border:none;font-weight:bold}img#preview{max-width:100%;border-radius:10px;margin-top:10px}.timer{background:#ff9800;color:#fff;padding:8px;text-align:center;font-size:12px;display:none}</style></head><body>
          <div class="header"><span id="tabChat" class="active" onclick="showChat()">💬 ChatGPT</span><span>My AI Sadi</span><span id="tabImg" onclick="showImg()">🎨 Photo</span></div>
          <div id="timer" class="timer">⏳ 45s Wait করো ভাই...</div>
          <div id="chat"><div class="msg ai">Hey! I am My AI Sadi V3 Fixed by SADI DEVELOPER! এখন আর Limit Error আসবে না! 😊</div></div>
          <div id="imageTab"><div class="img-card"><h3>📸 Photo Edit & AI Image</h3><input type="file" id="fileIn" accept="image/*"><img id="preview" style="display:none"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button onclick="filter('none')" style="width:auto">Original</button><button onclick="filter('grayscale(100%)')" style="width:auto">B&W</button><button onclick="filter('sepia(100%)')" style="width:auto">Sepia</button><button onclick="filter('contrast(150%) brightness(120%)')" style="width:auto">HD</button><button onclick="filter('blur(2px)')" style="width:auto">Blur</button></div><input id="aiPrompt" placeholder="যেমন: একটা ভাইরাল বিড়াল, cute cat"><button onclick="generateAI()">✨ AI Image Generate (V3 Fixed)</button><button onclick="downloadImg()">⬇️ Download</button></div></div>
          <div class="input-area"><input id="input" placeholder="প্রশ্ন করো..."><button id="send">SEND</button></div>
          <div style="background:#000;color:#fff;padding:8px;text-align:center;font-weight:bold;letter-spacing:2px;font-size:12px">SADI DEVELOPER</div>
          <script>
          const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),preview=document.getElementById('preview'),fileIn=document.getElementById('fileIn'),aiPrompt=document.getElementById('aiPrompt'),timerDiv=document.getElementById('timer');
          let isWaiting=false;
          function showChat(){document.getElementById('chat').style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('tabChat').classList.add('active');document.getElementById('tabImg').classList.remove('active')}
          function showImg(){document.getElementById('chat').style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('tabImg').classList.add('active');document.getElementById('tabChat').classList.remove('active')}
          function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
          fileIn.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)}
          function filter(f){preview.style.filter=f}
          function downloadImg(){if(!preview.src||preview.style.display=='none')return alert('আগে ছবি আনো!');const a=document.createElement('a');a.href=preview.src;a.download='sadi-image.jpg';a.click()}
          function startTimer(sec){isWaiting=true;timerDiv.style.display='block';let s=sec;const it=setInterval(()=>{timerDiv.textContent='⏳ ভাই '+s+' সেকেন্ড Wait করো, Free API Limit...';s--;if(s<0){clearInterval(it);timerDiv.style.display='none';isWaiting=false}},1000)}
          async function generateAI(){if(isWaiting)return alert('Wait করো ভাই!');const p=aiPrompt.value.trim()||input.value.trim();if(!p)return alert('Prompt লিখো! যেমন: একটা বিড়াল');addMsg('🎨 Generating: '+p,'user');const seed=Math.floor(Math.random()*99999);preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(p+', high quality, 8k')+'?seed='+seed+'&nologo=true&model=flux';preview.style.display='block';preview.onload=()=>{addMsg('✅ Image Ready! Download করতে পারো!','ai')};preview.onerror=()=>{preview.src='https://picsum.photos/seed/'+seed+'/512/512';addMsg('Backup image loaded! Pollinations limit, 45s পর আবার try করো','ai');startTimer(45)}}
          async function askAI(){if(isWaiting)return alert('30s wait করো ভাই!');const q=input.value.trim();if(!q)return;addMsg(q,'user');input.value='';const ty=addMsg('Sadi ভাবছে...','ai');try{const res=await fetch('https://text.pollinations.ai/'+encodeURIComponent('You are My AI Sadi created by SADI DEVELOPER. Reply short in Bengali. User says: '+q));let txt=await res.text();if(txt.includes('Free limit reached')||txt.includes('Please wait')){ty.textContent='⏳ ভাই Free Limit! 30s পর Auto Reply দেবো...';startTimer(30);setTimeout(async()=>{const res2=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q));ty.textContent=await res2.text()},31000);return}ty.textContent=txt}catch(e){ty.textContent='আমি Sadi AI! তুমি বললে: '+q+' - আমি আছি! Internet টা চেক করো ভাই!'}chat.scrollTop=chat.scrollHeight}
          send.onclick=askAI;input.onkeypress=e=>{if(e.key==='Enter')askAI()}
          </script></body></html>
          HTMLEND
          echo '{"appId":"com.myaisadi.app","appName":"My AI Sadi","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: My-AI-Sadi-V3-Fixed-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
