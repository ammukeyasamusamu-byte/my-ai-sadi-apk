name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build V17 Premium Chat
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SADI AI</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}#splash{position:fixed;inset:0;background:radial-gradient(circle at center,#667eea 0%,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;animation:fadeOut .6s 3s forwards}#logo{width:110px;height:110px;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:55px;animation:pop 1s infinite alternate;box-shadow:0 10px 40px rgba(102,126,234,.5)}@keyframes pop{to{transform:scale(1.12)}}@keyframes fadeOut{to{opacity:0;visibility:hidden}}#logoText{margin-top:18px;font-size:34px;font-weight:900;letter-spacing:6px}#appSub{margin-top:4px;font-size:11px;opacity:.6;letter-spacing:4px}.loading{margin-top:18px;width:160px;height:4px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}.bar{height:100%;width:0%;background:#fff;animation:load 2.8s ease-out forwards}@keyframes load{to{width:100%}}.header{background:#151515;padding:10px;display:flex;justify-content:space-around;font-weight:700;font-size:10px;border-bottom:1px solid #222;letter-spacing:1px}.active{background:#667eea!important;color:#fff!important;border-radius:20px;padding:6px 12px;box-shadow:0 2px 10px rgba(102,126,234,.4)}#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,#0f0f0f,#0a0a0a)}.msg{padding:12px 16px;border-radius:18px;max-width:82%;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;animation:slide .25s ease-out;box-shadow:0 2px 8px rgba(0,0,0,.2)}@keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}.user{background:linear-gradient(135deg,#667eea,#764ba2);align-self:flex-end;border-bottom-right-radius:6px;color:#fff}.ai{background:#1e1e1e;border:1px solid #2a2a2a;align-self:flex-start;border-bottom-left-radius:6px}.time{font-size:9px;opacity:.4;margin-top:4px;display:block}.typing{display:flex;gap:4px;padding:14px 18px;background:#1e1e1e;border-radius:18px;width:fit-content;border-bottom-left-radius:6px}.dot{width:6px;height:6px;background:#667eea;border-radius:50%;animation:bounce 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:.5}40%{transform:scale(1);opacity:1}}#gameTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px}.card{background:#1a1a1a;padding:14px;border-radius:16px;border:1px solid #2a2a2a}.chip{display:inline-block;padding:8px 12px;margin:4px;background:#222;border:1px solid #333;border-radius:20px;font-size:12px;cursor:pointer;transition:.2s}.chip:active{transform:scale(.95);background:#667eea}.input-area{display:flex;align-items:center;padding:10px 12px;background:#151515;gap:8px;border-top:1px solid #222}#inp{flex:1;padding:13px 18px;border-radius:26px;background:#222;color:#fff;border:1px solid #333;outline:none;font-size:14px;transition:.2s}#inp:focus{border-color:#667eea;background:#1e1e1e}#sendBtn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(102,126,234,.4)}img#preview{max-width:100%;border-radius:12px;margin-top:8px}.btn{width:100%;padding:13px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:8px}.sbtn{padding:8px 12px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;margin:3px;font-size:11px}</style></head><body>
          <div id="splash"><div id="logo">🤖</div><div id="logoText">SADI AI</div><div id="appSub">PREMIUM CHAT V17</div><div class="loading"><div class="bar"></div></div></div>
          <div class="header"><span id="tC" class="active" onclick="sC()">💬 CHAT</span><span id="tG" onclick="sG()">🎮 GAMES</span><span id="tI" onclick="sI()">🎨 EDIT</span></div>
          <div id="chat"></div>
          <div id="gameTab"><div class="card" style="background:linear-gradient(135deg,#ffeb3b 0%,#ff9800 100%);color:#000"><h3 style="font-size:15px">🎲 লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো!</h3><p style="font-size:12px;margin-top:6px">আমি সব গেমের ব্যাপারে হেল্প করতে পারি</p><div style="margin-top:10px"><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Ludo Star এ কিভাবে সবসময় জিতবো? Pro trick দাও')">🏆 জেতার Trick</span><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Ludo তে 6 বেশি কিভাবে আনবো?')">🎲 6 Trick</span><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Safe zone trick কি? কখন Token মারবো?')">🛡️ Safe Trick</span></div></div><div class="card"><h3>🎮 All Games Help</h3><div style="margin-top:8px"><span class="chip" onclick="askChip('Free Fire এ rank push কিভাবে করবো Heroic যাওয়ার trick?')">🔥 FF Rank Push</span><span class="chip" onclick="askChip('Free Fire এ headshot কিভাবে মারবো best sensitivity?')">🎯 Headshot Trick</span><span class="chip" onclick="askChip('PUBG Mobile best sensitivity code দাও recoil control')">🔫 PUBG Sensitivity</span><span class="chip" onclick="askChip('PUBG Conqueror কিভাবে যাবো?')">🏆 Conqueror</span><span class="chip" onclick="askChip('Roblox এ free robux কিভাবে পাবো best way?')">🧱 Roblox</span><span class="chip" onclick="askChip('Carrom Pool এ direct shot trick দাও')">🎯 Carrom</span></div></div><div class="card"><b>🎨 Image Generate</b><br><input id="pmt" style="width:100%;padding:11px;margin-top:8px;border-radius:10px;background:#222;color:#fff;border:1px solid #333" placeholder="যেমন: ludo star, free fire character"><img id="preview" style="display:none"><button class="btn" onclick="gen()">✨ Image বানাও</button><button class="btn" style="background:#222" onclick="dwn()">⬇️ Download</button></div></div>
          <div id="imageTab" style="display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px"><div class="card"><b>📸 Photo Edit Pro</b><br><input type="file" id="fIn" accept="image/*"><div style="margin-top:8px;display:flex;flex-wrap:wrap"><button class="sbtn" onclick="setF('none')">Original</button><button class="sbtn" onclick="setF('grayscale(100%)')">B&W</button><button class="sbtn" onclick="setF('contrast(150%) brightness(110%)')">HD Pro</button><button class="sbtn" onclick="setF('sepia(100%)')">Sepia</button></div></div></div>
          <div class="input-area"><span onclick="startV()" style="font-size:22px;cursor:pointer">🎤</span><input id="inp" placeholder="লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো..."><button id="sendBtn">➤</button></div>
          <div style="background:#000;color:#667eea;padding:7px;text-align:center;font-weight:900;font-size:9px;letter-spacing:3px;border-top:1px solid #151515">SADI AI - PREMIUM CHAT V17</div>
          <script>
          setTimeout(()=>{document.getElementById('splash').style.display='none'},3000);
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),sendBtn=document.getElementById('sendBtn'),preview=document.getElementById('preview'),fIn=document.getElementById('fIn'),pmt=document.getElementById('pmt');
          let lastImgTime=0;
          function getTime(){return new Date().toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'})}
          function sC(){chat.style.display='flex';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='none';document.getElementById('tC').classList.add('active');document.getElementById('tG').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sG(){chat.style.display='none';document.getElementById('gameTab').style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('tG').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sI(){chat.style.display='none';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('tI').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tG').classList.remove('active')}
          function addM(t,c){let wrap=document.createElement('div');wrap.style.display='flex';wrap.style.flexDirection='column';wrap.style.alignItems=c==='user'?'flex-end':'flex-start';let d=document.createElement('div');d.className='msg '+c;d.textContent=t;let tm=document.createElement('span');tm.className='time';tm.textContent=getTime();wrap.appendChild(d);wrap.appendChild(tm);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;sC();return d}
          function showTyping(){let w=document.createElement('div');w.id='typing';w.className='typing';w.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';chat.appendChild(w);chat.scrollTop=chat.scrollHeight;return w}
          function initChat(){addM('👋 হ্যালো ভাই!\\n\\n🎮 আমি সব গেমের ব্যাপারে হেল্প করতে পারি!\\n\\n🎲 লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো!\\nLudo Star, Free Fire, PUBG, Roblox - সব গেমের Pro Tips দেবো!\\n\\nনিচের Chip এ ক্লিক করো বা লিখো 👇','ai')}
          initChat();
          fIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)}
          function setF(f){preview.style.filter=f}
          function dwn(){if(!preview.src)return alert('ছবি নাই!');let a=document.createElement('a');a.href=preview.src;a.download='sadi-ai.jpg';a.click()}
          async function gen(){let raw=(pmt.value.trim()||inp.value.trim()||'');if(!raw)return alert('লিখো!');let now=Date.now(),diff=(now-lastImgTime)/1000;if(diff<46){return alert('45s Wait!')}
          lastImgTime=now;addM('🎨 '+raw,'user');let finalPrompt=raw;if(raw.toLowerCase().includes('ludo')){finalPrompt='Ludo star board, colorful dice, fun game, 8k, '+raw} else if(raw.toLowerCase().includes('free fire')){finalPrompt='Garena Free Fire character, 8k, '+raw} else if(raw.toLowerCase().includes('pubg')){finalPrompt='PUBG Mobile character, 8k, '+raw} let ty=showTyping();preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(finalPrompt)+'?seed='+Date.now()+'&width=768&height
