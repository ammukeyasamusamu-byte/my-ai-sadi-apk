name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build V2 APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My AI Sadi</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#eef2ff;height:100vh;display:flex;flex-direction:column}.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:14px;text-align:center;font-weight:bold;font-size:20px;display:flex;justify-content:space-around;align-items:center}.header span{cursor:pointer;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.2)}.header .active{background:#fff;color:#764ba2}#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}.msg{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.4;word-break:break-word}.user{background:#667eea;color:#fff;align-self:flex-end}.ai{background:#fff;color:#333;align-self:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.1)}.input-area{display:flex;padding:12px;background:#fff;border-top:1px solid #eee;gap:8px}#input{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #ddd;outline:none}#send{background:#667eea;color:#fff;border:none;padding:0 22px;border-radius:25px;font-weight:bold}.footer{background:#000;color:#fff;padding:8px;text-align:center;font-weight:bold;letter-spacing:2px;font-size:12px}#imageTab{display:none;flex:1;overflow-y:auto;padding:15px;flex-direction:column;gap:12px}.img-card{background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.img-card input,.img-card button{width:100%;margin-top:8px;padding:12px;border-radius:8px;border:1px solid #ddd}.img-card button{background:#667eea;color:#fff;border:none;font-weight:bold}img#preview{max-width:100%;border-radius:10px;margin-top:10px;filter:none;transition:.3s}</style></head><body>
          <div class="header"><span id="tabChat" class="active" onclick="showChat()">💬 ChatGPT</span><span>My AI Sadi</span><span id="tabImg" onclick="showImg()">🎨 Photo Edit</span></div>
          <div id="chat"><div class="msg ai">Hey! I am My AI Sadi V2, created by SADI DEVELOPER! I can chat like ChatGPT & edit photos! 😊</div></div>
          <div id="imageTab"><div class="img-card"><h3>📸 Photo Edit & AI Image</h3><input type="file" id="fileIn" accept="image/*"><img id="preview" style="display:none"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button onclick="filter('none')" style="width:auto">Original</button><button onclick="filter('grayscale(100%)')" style="width:auto">B&W</button><button onclick="filter('sepia(100%)')" style="width:auto">Sepia</button><button onclick="filter('contrast(150%) brightness(120%)')" style="width:auto">HD</button><button onclick="filter('blur(2px)')" style="width:auto">Blur</button></div><input id="aiPrompt" placeholder="AI দিয়ে ছবি বানাও, যেমন: a cute cat in space"><button onclick="generateAI()">✨ AI Image Generate</button><button onclick="downloadImg()">⬇️ Download Image</button></div></div>
          <div class="input-area"><input id="input" placeholder="ChatGPT এর মত প্রশ্ন করো..."><button id="send">SEND</button></div>
          <div class="footer">SADI DEVELOPER</div>
          <script>
          const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),preview=document.getElementById('preview'),fileIn=document.getElementById('fileIn'),aiPrompt=document.getElementById('aiPrompt');
          let currentFilter='none';
          function showChat(){document.getElementById('chat').style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('tabChat').classList.add('active');document.getElementById('tabImg').classList.remove('active')}
          function showImg(){document.getElementById('chat').style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('tabImg').classList.add('active');document.getElementById('tabChat').classList.remove('active')}
          function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
          fileIn.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)}
          function filter(f){currentFilter=f;preview.style.filter=f}
          function downloadImg(){if(!preview.src)return alert('আগে ছবি আপলোড করো!');const a=document.createElement('a');a.href=preview.src;a.download='sadi-edit.jpg';a.click()}
          function generateAI(){const p=aiPrompt.value.trim()||document.getElementById('input').value.trim();if(!p)return alert('Prompt লিখো!');preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?nologo=true&seed='+Date.now();preview.style.display='block';addMsg('AI Image Generated: '+p,'ai')}
          async function askAI(){const q=input.value.trim();if(!q)return;addMsg(q,'user');input.value='';const ty=addMsg('Sadi is thinking...','ai');try{const res=await fetch('https://text.pollinations.ai/'+encodeURIComponent('You are My AI Sadi created by SADI DEVELOPER. Reply in same language user uses. User: '+q));const txt=await res.text();ty.textContent=txt||'Sorry, try again!'}catch(e){ty.textContent='You said: '+q+'. I am Sadi AI by SADI DEVELOPER! (Internet check করো)' }chat.scrollTop=chat.scrollHeight}
          send.onclick=askAI;input.onkeypress=e=>{if(e.key==='Enter')askAI()}
          </script></body></html>
          HTMLEND
          echo '{"appId":"com.myaisadi.app","appName":"My AI Sadi","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: My-AI-Sadi-V2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
