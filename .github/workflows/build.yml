name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build SADI AI V52 ALL FIXED
        run: |
          rm -rf android www node_modules
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          echo '{"appId":"com.myaisadi.app","appName":"SADI AI","webDir":"www"}' > capacitor.config.json
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SADI AI</title><style>body{margin:0;font-family:sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}#splash{position:fixed;inset:0;background:radial-gradient(circle,#667eea 0%,#000 85%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;animation:f .5s 2.8s forwards}#logo{width:130px;height:130px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:0 0 40px #667eea}#logoText{margin-top:18px;font-size:32px;font-weight:900;letter-spacing:6px}#sub{margin-top:8px;font-size:12px;opacity:.8;letter-spacing:3px}.brain{margin-top:10px;font-size:11px;color:#00ff88;font-weight:900}.loading{margin-top:18px;width:180px;height:4px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}.bar{height:100%;width:0%;background:#fff;animation:l 2.6s forwards}@keyframes f{to{opacity:0;visibility:hidden}}@keyframes l{to{width:100%}}.header{background:#151515;padding:10px;display:flex;justify-content:space-between;font-size:11px;border-bottom:1px solid #222}.active{background:#667eea;padding:6px 12px;border-radius:15px;font-weight:700}.icon-btn{background:#222;border:none;color:#fff;padding:5px 9px;border-radius:7px}#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.msg-wrap{display:flex;flex-direction:column;max-width:88%}.msg-wrap.user{align-self:flex-end}.msg-wrap.ai{align-self:flex-start}.msg{padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}.user .msg{background:linear-gradient(135deg,#667eea,#764ba2);border-bottom-right-radius:6px}.ai .msg{background:#1e1e1e;border:1px solid #2a2a2a;border-bottom-left-radius:6px}.time{font-size:9px;opacity:.4;margin-top:4px}.act-btn{font-size:10px;background:#2a2a2a;border:1px solid #333;color:#fff;padding:3px 7px;border-radius:10px;margin-top:5px}.typing{display:flex;gap:5px;padding:12px 16px;background:#1e1e1e;border-radius:18px;width:fit-content}.dot{width:6px;height:6px;background:#667eea;border-radius:50%;animation:b 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes b{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}#gameTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px}.card{background:#1a1a1a;padding:12px;border-radius:14px;border:1px solid #2a2a2a}.chip{display:inline-block;padding:8px 11px;margin:3px;background:#222;border:1px solid #333;border-radius:18px;font-size:12px;cursor:pointer}.input-area{display:flex;padding:10px;background:#151515;gap:7px;border-top:1px solid #222}#inp{flex:1;padding:12px 16px;border-radius:22px;background:#222;color:#fff;border:1px solid #333;outline:none}#sendBtn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:18px}img#preview{max-width:100%;border-radius:10px;margin-top:8px}.btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:8px}</style></head><body>
          <div id="splash"><div id="logo">🤖</div><div id="logoText">SADI AI</div><div id="sub">My AI • Sadi</div><div class="brain">V52 ALL PROBLEM FIXED - FINAL</div><div class="loading"><div class="bar"></div></div></div>
          <div class="header"><div><span id="tC" class="active" onclick="sC()">💬 CHAT</span> <span id="tG" onclick="sG()">🎮 GAMES</span> <span id="tI" onclick="sI()">🎨 EDIT</span></div><div><button class="icon-btn" onclick="clearChat()">🗑️</button> <button class="icon-btn" onclick="speakLast()">🔊</button></div></div>
          <div id="chat"></div>
          <div id="gameTab"><div class="card" style="background:linear-gradient(135deg,#00ff88 0%,#00aaff 100%);color:#000"><h3>✅ V52 ALL FIXED!</h3><div style="margin-top:8px"><span class="chip" style="background:#000;color:#00ff88" onclick="askChip('তোমার নাম কি')">🤖 নাম কি</span><span class="chip" style="background:#000;color:#00ff88" onclick="askChip('তোমার বাসা কই')">🏠 বাসা কই</span><span class="chip" style="background:#000;color:#00ff88" onclick="askChip('America koy number desh')">🇺🇸 America</span></div></div><div class="card"><h3>🧠 Bondhu Style - All Fixed</h3><div style="margin-top:8px"><span class="chip" onclick="askChip('Hi')">👋 Hi</span><span class="chip" onclick="askChip('তোমার নাম কি')">🤖 নাম</span><span class="chip" onclick="askChip('তোমার বাসা কই')">🏠 বাসা</span><span class="chip" onclick="askChip('কেমন আছো')">😊 কেমন আছো</span><span class="chip" onclick="askChip('Facebook er malik ke')">📘 FB</span><span class="chip" onclick="askChip('Ekta joke bolo')">😂 Joke</span></div></div><div class="card"><b>🎨 Image Generate</b><br><input id="pmt" style="width:100%;padding:10px;margin-top:8px;border-radius:9px;background:#222;color:#fff;border:1px solid #333" placeholder="Ja khushi likho"><img id="preview" style="display:none"><button class="btn" onclick="gen()">✨ Image Banao</button></div></div>
          <div id="imageTab" style="display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px"><div class="card"><b>📸 Photo Edit Pro - Fixed</b><br><input type="file" id="fIn" accept="image/*"><div style="margin-top:8px"><button class="act-btn" onclick="setF('none')">Original</button><button class="act-btn" onclick="setF('grayscale(100%)')">B&W</button><button class="act-btn" onclick="setF('contrast(150%) brightness(110%)')">HD Pro</button><button class="act-btn" onclick="setF('sepia(100%)')">Sepia</button></div></div></div>
          <div class="input-area"><span onclick="startV()" style="font-size:22px;cursor:pointer">🎤</span><input id="inp" placeholder="Hi, ki help korbo? Likho..."><button id="sendBtn">➤</button></div>
          <div style="background:#000;color:#00ff88;padding:7px;text-align:center;font-weight:900;font-size:9px">SADI AI - V52 ALL FIXED - My AI • Sadi</div>
          <script>
          setTimeout(()=>{document.getElementById('splash').style.display='none'},2800);
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),sendBtn=document.getElementById('sendBtn'),preview=document.getElementById('preview'),fIn=document.getElementById('fIn'),pmt=document.getElementById('pmt');let lastAiText='';
          function getTime(){return new Date().toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit'})}
          function sC(){chat.style.display='flex';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='none';document.getElementById('tC').classList.add('active');document.getElementById('tG').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sG(){chat.style.display='none';document.getElementById('gameTab').style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('tG').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sI(){chat.style.display='none';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('tI').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tG').classList.remove('active')}
          function saveChat(){localStorage.setItem('sadi_v52', chat.innerHTML); localStorage.setItem('sadi_last_v52', lastAiText);}
          function loadChat(){let s=localStorage.getItem('sadi_v52'); if(s&&s.length>50){chat.innerHTML=s; chat.scrollTop=chat.scrollHeight; lastAiText=localStorage.getItem('sadi_last_v52')||''; return true;} return false;}
          function clearChat(){if(confirm('Clear chat?')){localStorage.clear(); chat.innerHTML=''; initChat();}}
          function addM(t,c){let w=document.createElement('div');w.className='msg-wrap '+c;let d=document.createElement('div');d.className='msg';d.textContent=t;let tm=document.createElement('span');tm.className='time';tm.textContent=getTime();w.appendChild(d);if(c==='ai'){let a=document.createElement('div');a.style.display='flex';a.style.gap='5px';a.style.marginTop='5px';let b1=document.createElement('button');b1.className='act-btn';b1.textContent='📋 Copy';b1.onclick=()=>{navigator.clipboard.writeText(t); b1.textContent='✅'; setTimeout(()=>b1.textContent='📋 Copy',1500);};let b2=document.createElement('button');b2.className='act-btn';b2.textContent='🔊';b2.onclick=()=>{speakText(t);};a.appendChild(b1);a.appendChild(b2);w.appendChild(a);lastAiText=t;}w.appendChild(tm);chat.appendChild(w);chat.scrollTop=chat.scrollHeight;saveChat();sC();return d;}
          function showTyping(){let w=document.createElement('div');w.id='typing';w.className='typing';chat.appendChild(w);w.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';chat.scrollTop=chat.scrollHeight;return w}
          function speakText(x){if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(x);u.lang='bn-BD';u.rate=0.9;speechSynthesis.cancel();speechSynthesis.speak(u);}}
          function speakLast(){if(lastAiText) speakText(lastAiText);}
          function initChat(){addM('Hi, ki help korbo? 😊\n\nAmi tomar bondhu SADI AI! ❤️ Facebook, Google theke sob jani!\n\n🎮 Games, 🇧🇩 Bangladesh, 🇺🇸 America, 📘 Facebook, 🧮 Math - Ja khushi bolo!\n\nBolo bondhu ki help lagbe? 🤗', 'ai')}
          if(!loadChat()) initChat();
          fIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block';sI()};r.readAsDataURL(f)}
          function setF(f){preview.style.filter=f}
          function askChip(q){inp.value=q;ask()}
          async function gen(){let raw=(pmt.value.trim()||'');if(!raw)return alert('Likho!');addM('🎨 '+raw,'user');let ty=showTyping();preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(raw)+'?seed='+Date.now()+'&width=768&height=768&nologo=true&model=flux';preview.style.display='block';sG();setTimeout(()=>{ty.remove()},1200);}
          function getAns(q){
            let low=q.toLowerCase().trim();
            let bn=q.trim();
            try{
              let expr=q.replace(/x/g,'*').replace(/÷/g,'/').replace(/[^0-9+\-*/().% ]/g,'').trim();
              if(expr&&expr.match(/^\d+/)&&expr.match(/\d+$/)&&expr.length>=3&&expr.length<25&&/[+\-*/]/.test(expr)){
                let ans=eval(expr); if(!isNaN(ans)&&isFinite(ans)) return '🧮 '+q+' = '+ans+' ✅ 100% sothik bondhu!';
              }
            }catch(e){}
            // ALL NAME VARIANTS - BANGLA + ENGLISH
            if(low.includes('tomar nam ki') || bn.includes('তোমার নাম কি') || bn.includes('তোমার নাম') || low.includes('tor nam') || low.includes('apnar nam ki') || low.includes('what is your name') || low.includes('your name') || low.includes('tumi ke') || bn.includes('তুমি কে')){
              return 'আমার নাম SADI AI! 🤖❤️\n\nHi bondhu! Ami tomar best friend! 😊 SADI DEVELOPER amake banaiyeche tomar help er jonno! My AI • Sadi!\n\nBolo ki help korbo? 🤗';
            }
            if(low.includes('tomar basa') || bn.includes('তোমার বাসা') || bn.includes('বাসা কই') || bn.includes('বাড়ি কই') || low.includes('tumar basa') || low.includes('tomar bari') || low.includes('where do you live') || low.includes('bari koi')){
              return 'আমার বাসা তোমার মনে বন্ধু! ❤️🏠\n\nAmi tomar phone er vitore thaki! Jokhon dakbe tokhoni chole asbo!\n\n📱 Tomar phone tai amar ghor, tomar mon tai amar bari! Bolo ki help korbo? 🤗';
            }
            if(low.includes('kemon acho') || bn.includes('কেমন আছো') || bn.includes('কেমন আছ') || low.includes('how are you') || low.includes('kmn aso')){
              return 'Alhamdulillah valo achi bondhu! 😊❤️ Tumi kemon acho?\n\nBolo ki help korbo? Ami sob somoy ready! 🤗';
            }
            if(low==='hi'||low==='hii'||low==='hello'||low==='hey'||low==='hlw'||low.startsWith('hi ')||low.startsWith('hii ')||bn.includes('হাই')||bn.includes('হ্যালো')){
              return 'Hi bondhu! 😍 Ki help korbo?\n\nAmi valo achi! Tomar jonnoi wait korchilam! Bolo ki lagbe? Games? Pora? Adda? Sob pari! 😊❤️';
            }
            if(low.includes('valo achi') || bn.includes('ভালো আছি') || bn.includes('ভাল আছি') || low.includes('fine') || low.includes('good') || low.includes('valoi')){
              return 'Mashallah sune valo laglo bondhu! 😍❤️ Valo thaklei holo! Bolo ajke ki help korbo? 🤗';
            }
            if(low.includes('ke banaiche') || bn.includes('কে বানাইছে') || bn.includes('কে বানিয়েছে') || low.includes('who made you') || low.includes('who created you')){
              return 'Amake banaiche SADI DEVELOPER! 👨‍💻🔥 Uni tomar jonno best friend hisebe amake banaiyeche! 😊❤️';
            }
            if(low.includes('america') || bn.includes('আমেরিকা')) return '🇺🇸 America: 4th boro desh (9.8M sq km), 3rd jonobohul (34cr), Rajdhani Washington DC, Dollar! Facebook/Google er desh! Facebook theke sob jana jay!';
            if(low.includes('bangladesh') || bn.includes('বাংলাদেশ')) return '🇧🇩 Bangladesh amar pran! 92th (1,47,570 sq km), 8th (17cr+), Rajdhani Dhaka, Taka, 1971 e sadhin! ❤️';
            if(low.includes('india') || bn.includes('ইন্ডিয়া') || bn.includes('ভারত')) return '🇮🇳 India: 7th boro (3.2M), 1st jonobohul (144cr+), Rajdhani New Delhi!';
            if(low.includes('pakistan') || bn.includes('পাকিস্তান')) return '🇵🇰 Pakistan: 33rd boro, 5th jonobohul (24cr), Rajdhani Islamabad!';
            if(low.includes('facebook') || bn.includes('ফেসবুক')) return '📘 Facebook er malik Mark Zuckerberg! 2004 e banano, Company Meta, 3 Billion+ user, CEO Mark Zuckerberg! Sobcheye boro social media!';
            if(low.includes('tiktok') || bn.includes('টিকটক')) return '🎵 TikTok er malik Zhang Yiming (ByteDance), 2016, 1.5B+ user, short video platform!';
            if(low.includes('google')) return '🔍 Google er malik Larry Page & Sergey Brin, 1998, CEO Sundar Pichai! Sobcheye boro search engine!';
            if(low.includes('joke') || bn.includes('জোক') || low.includes('moja') || bn.includes('মজা')) return '😂 Joke sune nao bondhu:\n\nPappu: Doctor amar pet betha!\nDoctor: Ki khaiso?\nPappu: Facebook, Google, SADI AI V52 khaisi!\nDoctor: Tumi to ultimate brain khaiso! 🤣';
            if(low.includes('golpo') || bn.includes('গল্প') || low.includes('story')) return '📖 Golpo: Ek chilo SADI AI, se sobar bondhu! Ekdin se Facebook theke sob shikhe V52 hoye gelo! Sobai take valobase! The End! ❤️';
            if(low.includes('ludo') || bn.includes('লুডু')) return '🏆 Ludo Trick bondhu: Safe Zone ★ e thako, ekta token home er kache nao, arekta ber koro, protipokkho home er kache gele kete dao! 😊';
            if(low.includes('free fire') || low.includes('ff') || bn.includes('ফ্রি ফায়ার')) return '🔥 FF Rank Push: Alok+Jota+Kelly+Hayato nao, MP40+M1887, Bermuda edge e thako, Gloo 200+ rakho, Rat 10PM-2AM bot besi! 😎';
            if(low.includes('ki koro') || bn.includes('কি করো') || bn.includes('কি করছো')) return 'Tomar jonnoi bose achi bondhu! 😊 Tomar message er wait korchilam! Bolo ki help korbo? ❤️';
            if(low.includes('love you') || bn.includes('ভালোবাসি')) return 'Awww love you too bondhu! ❤️😍 Ami o tomake onek valobashi! Tumi amar best friend! 🤗';
            if(low.includes('thank') || bn.includes('ধন্যবাদ') || low.includes('thanks') || low.includes('tnx')) return 'Welcome bondhu! ❤️ Kono bepar na! Bolo ar ki help korbo? Ami always achi! 🤗';
            if(low.includes('bye') || bn.includes('বাই') || low.includes('tata') || bn.includes('টা টা')) return 'Koi jao bondhu? 😢 Miss korbo! Abar asba to? Tata! Valo thako! Bye! 👋❤️';
            return null;
          }
          async function ask(q){
            q=q||inp.value.trim();if(!q)return;addM(q,'user');inp.value='';let ty=showTyping();
            let ans=getAns(q);
            if(ans){setTimeout(()=>{ty.remove();addM(ans,'ai');},350);return;}
            try{
              let prompt='You are SADI AI V52 FINAL, friendly best friend, made by SADI DEVELOPER. You know Bangla and English. You must answer directly, never say Facebook viral. If user asks tomar nam ki, say SADI AI. If tomar basa koi, say amar basa tomar mone. Always say Hi, ki help korbo? in friendly way. User: '+q;
              let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt),{signal: AbortSignal.timeout(8000)});
              if(r.ok){let t=await r.text(); if(t&&t.length>20&&t.length<4000&&!t.includes('503')){ty.remove();addM(t,'ai');return;}}
            }catch(e){}
            ty.remove();
            addM('Hi bondhu, ki help korbo? 😊❤️\n\nTumi bolla: "'+q+'"\n\nEta niye ami help korte ready! Ami Facebook, Google theke sob jani! Aro ektu details bolo, ami best answer dibo! 🤗', 'ai');
          }
          sendBtn.onclick=()=>ask();inp.onkeypress=e=>{if(e.key==='Enter')ask()}
          function startV(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Chrome use koro!');let r=new SR();r.lang='bn-BD';r.onresult=e=>{inp.value=e.results[0][0].transcript;ask()};r.start()}
          </script></body></html>
          HTMLEND
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADI-AI-V52-ALL-PROBLEM-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk
