name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build SADI AI V54 NO EXTRA TALK
        run: |
          rm -rf android www node_modules
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          echo '{"appId":"com.myaisadi.app","appName":"SADI AI","webDir":"www"}' > capacitor.config.json
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SADI AI</title><style>body{margin:0;font-family:sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}#splash{position:fixed;inset:0;background:radial-gradient(circle,#667eea 0%,#000 85%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;animation:f .5s 2.8s forwards}#logo{width:130px;height:130px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:60px}#logoText{margin-top:18px;font-size:32px;font-weight:900;letter-spacing:6px}#sub{margin-top:8px;font-size:12px;opacity:.8}.brain{margin-top:10px;font-size:11px;color:#00ff88;font-weight:900}.loading{margin-top:18px;width:180px;height:4px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}.bar{height:100%;width:0%;background:#fff;animation:l 2.6s forwards}@keyframes f{to{opacity:0;visibility:hidden}}@keyframes l{to{width:100%}}.header{background:#151515;padding:10px;display:flex;justify-content:space-between;font-size:11px;border-bottom:1px solid #222}.active{background:#667eea;padding:6px 12px;border-radius:15px;font-weight:700}.icon-btn{background:#222;border:none;color:#fff;padding:5px 9px;border-radius:7px}#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.msg-wrap{display:flex;flex-direction:column;max-width:88%}.msg-wrap.user{align-self:flex-end}.msg-wrap.ai{align-self:flex-start}.msg{padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}.user .msg{background:linear-gradient(135deg,#667eea,#764ba2);border-bottom-right-radius:6px}.ai .msg{background:#1e1e1e;border:1px solid #2a2a2a;border-bottom-left-radius:6px}.time{font-size:9px;opacity:.4;margin-top:4px}.act-btn{font-size:10px;background:#2a2a2a;border:1px solid #333;color:#fff;padding:3px 7px;border-radius:10px;margin-top:5px}.typing{display:flex;gap:5px;padding:12px 16px;background:#1e1e1e;border-radius:18px;width:fit-content}.dot{width:6px;height:6px;background:#667eea;border-radius:50%;animation:b 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes b{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}#gameTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px}.card{background:#1a1a1a;padding:12px;border-radius:14px;border:1px solid #2a2a2a}.chip{display:inline-block;padding:8px 11px;margin:3px;background:#222;border:1px solid #333;border-radius:18px;font-size:12px;cursor:pointer}.input-area{display:flex;padding:10px;background:#151515;gap:7px;border-top:1px solid #222}#inp{flex:1;padding:12px 16px;border-radius:22px;background:#222;color:#fff;border:1px solid #333;outline:none}#sendBtn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:18px}img#preview{max-width:100%;border-radius:10px;margin-top:8px}.btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:8px}</style></head><body>
          <div id="splash"><div id="logo">🤖</div><div id="logoText">SADI AI</div><div id="sub">My AI • Sadi</div><div class="brain">V54 NO EXTRA TALK - DIRECT ANSWER</div><div class="loading"><div class="bar"></div></div></div>
          <div class="header"><div><span id="tC" class="active" onclick="sC()">💬 CHAT</span> <span id="tG" onclick="sG()">🎮 GAMES</span> <span id="tI" onclick="sI()">🎨 EDIT</span></div><div><button class="icon-btn" onclick="clearChat()">🗑️</button> <button class="icon-btn" onclick="speakLast()">🔊</button></div></div>
          <div id="chat"></div>
          <div id="gameTab"><div class="card" style="background:linear-gradient(135deg,#00ff88 0%,#00aaff 100%);color:#000"><h3>✅ V54 - Direct Answer Only!</h3><div style="margin-top:8px"><span class="chip" style="background:#000;color:#00ff88" onclick="askChip('আচ্ছা তোমাকে কে বানিয়েছে')">👨‍💻 কে বানিয়েছে?</span><span class="chip" style="background:#000;color:#00ff88" onclick="askChip('তোমার নাম কি')">🤖 নাম কি</span></div></div><div class="card"><h3>🧠 Direct Answer</h3><div style="margin-top:8px"><span class="chip" onclick="askChip('Hi')">👋 Hi</span><span class="chip" onclick="askChip('তোমার নাম কি')">🤖 নাম</span><span class="chip" onclick="askChip('আচ্ছা তোমাকে কে বানিয়েছে')">👨‍💻 বানিয়েছে</span><span class="chip" onclick="askChip('তোমার বাসা কই')">🏠 বাসা</span><span class="chip" onclick="askChip('কেমন আছো')">😊 কেমন আছো</span></div></div><div class="card"><b>🎨 Image Generate</b><br><input id="pmt" style="width:100%;padding:10px;margin-top:8px;border-radius:9px;background:#222;color:#fff;border:1px solid #333" placeholder="Ja khushi likho"><img id="preview" style="display:none"><button class="btn" onclick="gen()">✨ Image Banao</button></div></div>
          <div id="imageTab" style="display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px"><div class="card"><b>📸 Photo Edit Pro</b><br><input type="file" id="fIn" accept="image/*"><div style="margin-top:8px"><button class="act-btn" onclick="setF('none')">Original</button><button class="act-btn" onclick="setF('grayscale(100%)')">B&W</button><button class="act-btn" onclick="setF('contrast(150%) brightness(110%)')">HD Pro</button></div></div></div>
          <div class="input-area"><span onclick="startV()" style="font-size:22px;cursor:pointer">🎤</span><input id="inp" placeholder="Hi লিখো..."><button id="sendBtn">➤</button></div>
          <div style="background:#000;color:#00ff88;padding:7px;text-align:center;font-weight:900;font-size:9px">SADI AI - V54 DIRECT ANSWER - My AI • Sadi</div>
          <script>
          setTimeout(()=>{document.getElementById('splash').style.display='none'},2800);
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),sendBtn=document.getElementById('sendBtn'),preview=document.getElementById('preview'),fIn=document.getElementById('fIn'),pmt=document.getElementById('pmt');let lastAiText='';
          function getTime(){return new Date().toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit'})}
          function sC(){chat.style.display='flex';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='none';document.getElementById('tC').classList.add('active');document.getElementById('tG').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sG(){chat.style.display='none';document.getElementById('gameTab').style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('tG').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sI(){chat.style.display='none';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('tI').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tG').classList.remove('active')}
          function saveChat(){localStorage.setItem('sadi_v54', chat.innerHTML); localStorage.setItem('sadi_last_v54', lastAiText);}
          function loadChat(){let s=localStorage.getItem('sadi_v54'); if(s&&s.length>50){chat.innerHTML=s; chat.scrollTop=chat.scrollHeight; lastAiText=localStorage.getItem('sadi_last_v54')||''; return true;} return false;}
          function clearChat(){if(confirm('Clear chat?')){localStorage.clear(); chat.innerHTML=''; initChat();}}
          function addM(t,c){let w=document.createElement('div');w.className='msg-wrap '+c;let d=document.createElement('div');d.className='msg';d.textContent=t;let tm=document.createElement('span');tm.className='time';tm.textContent=getTime();w.appendChild(d);if(c==='ai'){let a=document.createElement('div');a.style.display='flex';a.style.gap='5px';a.style.marginTop='5px';let b1=document.createElement('button');b1.className='act-btn';b1.textContent='📋 Copy';b1.onclick=()=>{navigator.clipboard.writeText(t); b1.textContent='✅'; setTimeout(()=>b1.textContent='📋 Copy',1500);};let b2=document.createElement('button');b2.className='act-btn';b2.textContent='🔊';b2.onclick=()=>{speakText(t);};a.appendChild(b1);a.appendChild(b2);w.appendChild(a);lastAiText=t;}w.appendChild(tm);chat.appendChild(w);chat.scrollTop=chat.scrollHeight;saveChat();sC();return d;}
          function showTyping(){let w=document.createElement('div');w.id='typing';w.className='typing';chat.appendChild(w);w.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';chat.scrollTop=chat.scrollHeight;return w}
          function speakText(x){if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(x);u.lang='bn-BD';u.rate=0.9;speechSynthesis.cancel();speechSynthesis.speak(u);}}
          function speakLast(){if(lastAiText) speakText(lastAiText);}
          function initChat(){addM('Hi! 😊 Ami SADI AI!', 'ai')}
          if(!loadChat()) initChat();
          fIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block';sI()};r.readAsDataURL(f)}
          function setF(f){preview.style.filter=f}
          function askChip(q){inp.value=q;ask()}
          async function gen(){let raw=(pmt.value.trim()||'');if(!raw)return alert('Likho!');addM('🎨 '+raw,'user');let ty=showTyping();preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(raw)+'?seed='+Date.now()+'&width=768&height=768&nologo=true&model=flux';preview.style.display='block';sG();setTimeout(()=>{ty.remove()},1200);}
          function getAns(q){
            let low=q.toLowerCase().trim();
            let bn=q.trim();
            try{
              let expr=q.replace(/x/g,'*').replace(/÷/g,'/').replace(/[^0-9+\-*/().% ]/g,'').trim();
              if(expr&&expr.match(/^\d+/)&&expr.match(/\d+$/)&&expr.length>=3&&expr.length<25&&/[+\-*/]/.test(expr)){
                let ans=eval(expr); if(!isNaN(ans)&&isFinite(ans)) return '🧮 '+q+' = '+ans;
              }
            }catch(e){}
            let banaiWords=['বানাই','বানিয়ে','বানিয়েছে','বানিয়েছে','বানিয়েছ','বানাইছে','বানায়','কে বান','who made','who created','ke bana','banaiche','banaiyeche','baniyeche'];
            for(let w of banaiWords){ if(bn.includes(w) || low.includes(w)){ return 'আমাকে বানাইছে SADI DEVELOPER! 👨‍💻'; } }
            if(low.includes('tomar nam ki') || bn.includes('তোমার নাম কি') || bn.includes('তোমার নাম') || low.includes('your name') || low.includes('tumi ke') || bn.includes('তুমি কে')){
              return 'আমার নাম SADI AI! 🤖';
            }
            if(low.includes('tomar basa') || bn.includes('তোমার বাসা') || bn.includes('বাসা কই') || bn.includes('বাড়ি কই') || low.includes('where do you live')){
              return 'আমার বাসা তোমার ফোনে! 📱 তোমার মনেই থাকি! ❤️';
            }
            if(low.includes('kemon acho') || bn.includes('কেমন আছো') || bn.includes('কেমন আছ') || low.includes('how are you')){
              return 'ভালো আছি! 😊';
            }
            if(low==='hi'||low==='hii'||low==='hello'||low==='hey'||low==='hlw'||low.startsWith('hi ')||low.startsWith('hii ')||bn.includes('হাই')||bn.includes('হ্যালো')){
              return 'Hi! 😊';
            }
            if(low.includes('valo achi') || bn.includes('ভালো আছি') || low.includes('fine') || low.includes('good')){
              return 'ভালো শুনে খুশি হলাম! 😊';
            }
            if(low.includes('america') || bn.includes('আমেরিকা')) return '🇺🇸 America 4th বড় দেশ, 3rd জনবহুল, রাজধানী Washington DC!';
            if(low.includes('bangladesh') || bn.includes('বাংলাদেশ')) return '🇧🇩 বাংলাদেশ - রাজধানী ঢাকা, 1971 এ স্বাধীন!';
            if(low.includes('india') || bn.includes('ভারত')) return '🇮🇳 India - রাজধানী New Delhi!';
            if(low.includes('facebook') || bn.includes('ফেসবুক')) return '📘 Facebook এর মালিক Mark Zuckerberg!';
            if(low.includes('joke') || low.includes('moja')) return '😂 Joke: SADI AI V54 খাইছি! 🤣';
            if(low.includes('ludo')) return '🏆 Ludo: Safe Zone এ থাকো!';
            if(low.includes('free fire') || low.includes('ff')) return '🔥 FF: Alok+Jota+Kelly!';
            if(low.includes('love you') || bn.includes('ভালোবাসি')) return 'Love you too! ❤️';
            if(low.includes('thank') || bn.includes('ধন্যবাদ')) return 'Welcome! ❤️';
            if(low.includes('bye') || bn.includes('বাই')) return 'Bye! 👋';
            return null;
          }
          async function ask(q){
            q=q||inp.value.trim();if(!q)return;addM(q,'user');inp.value='';let ty=showTyping();
            let ans=getAns(q);
            if(ans){setTimeout(()=>{ty.remove();addM(ans,'ai');},350);return;}
            try{
              let prompt='You are SADI AI, made by SADI DEVELOPER. Answer directly and shortly, no extra ki help korbo. Use Bangla short answer. User: '+q;
              let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt),{signal: AbortSignal.timeout(8000)});
              if(r.ok){let t=await r.text(); if(t&&t.length>10&&t.length<800&&!t.includes('503')){ty.remove();addM(t,'ai');return;}}
            }catch(e){}
            ty.remove();
            addM('Hi! Ami SADI AI! 🤖', 'ai');
          }
          sendBtn.onclick=()=>ask();inp.onkeypress=e=>{if(e.key==='Enter')ask()}
          function startV(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Chrome use koro!');let r=new SR();r.lang='bn-BD';r.onresult=e=>{inp.value=e.results[0][0].transcript;ask()};r.start()}
          </script></body></html>
          HTMLEND
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADI-AI-V54-DIRECT-ANSWER
          path: android/app/build/outputs/apk/debug/app-debug.apk
