name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build SADI AI V19 Offline
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SADI AI</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}#splash{position:fixed;inset:0;background:radial-gradient(circle at center,#667eea 0%,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;animation:fadeOut .6s 3s forwards}#logo{width:110px;height:110px;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:55px;animation:pop 1s infinite alternate}@keyframes pop{to{transform:scale(1.12)}}@keyframes fadeOut{to{opacity:0;visibility:hidden}}#logoText{margin-top:18px;font-size:34px;font-weight:900;letter-spacing:6px}#appSub{margin-top:4px;font-size:11px;opacity:.6;letter-spacing:4px}.loading{margin-top:18px;width:160px;height:4px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}.bar{height:100%;width:0%;background:#fff;animation:load 2.8s forwards}@keyframes load{to{width:100%}}.header{background:#151515;padding:10px;display:flex;justify-content:space-around;font-weight:700;font-size:10px;border-bottom:1px solid #222}.active{background:#667eea!important;color:#fff!important;border-radius:20px;padding:6px 12px}#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.msg{padding:12px 16px;border-radius:18px;max-width:82%;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;animation:slide .25s}.user{background:linear-gradient(135deg,#667eea,#764ba2);align-self:flex-end;border-bottom-right-radius:6px}.ai{background:#1e1e1e;border:1px solid #2a2a2a;align-self:flex-start;border-bottom-left-radius:6px}.time{font-size:9px;opacity:.4;margin-top:4px}.typing{display:flex;gap:4px;padding:14px 18px;background:#1e1e1e;border-radius:18px;width:fit-content}.dot{width:6px;height:6px;background:#667eea;border-radius:50%;animation:bounce 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}#gameTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px}.card{background:#1a1a1a;padding:14px;border-radius:16px;border:1px solid #2a2a2a}.chip{display:inline-block;padding:8px 12px;margin:4px;background:#222;border:1px solid #333;border-radius:20px;font-size:12px;cursor:pointer}.input-area{display:flex;align-items:center;padding:10px 12px;background:#151515;gap:8px;border-top:1px solid #222}#inp{flex:1;padding:13px 18px;border-radius:26px;background:#222;color:#fff;border:1px solid #333;outline:none;font-size:14px}#sendBtn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}img#preview{max-width:100%;border-radius:12px;margin-top:8px}.btn{width:100%;padding:13px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:8px}.sbtn{padding:8px 12px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;margin:3px;font-size:11px}</style></head><body>
          <div id="splash"><div id="logo">🤖</div><div id="logoText">SADI AI</div><div id="appSub">OFFLINE V19</div><div class="loading"><div class="bar"></div></div></div>
          <div class="header"><span id="tC" class="active" onclick="sC()">💬 CHAT</span><span id="tG" onclick="sG()">🎮 GAMES</span><span id="tI" onclick="sI()">🎨 EDIT</span></div>
          <div id="chat"></div>
          <div id="gameTab"><div class="card" style="background:linear-gradient(135deg,#ffeb3b 0%,#ff9800 100%);color:#000"><h3>🎲 লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো!</h3><p style="font-size:12px;margin-top:6px;font-weight:bold">আমি সব গেমের ব্যাপারে হেল্প করতে পারি</p><div style="margin-top:10px"><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Ludo Star জেতার trick')">🏆 জেতার Trick</span><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Ludo 6 trick')">🎲 6 Trick</span><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Ludo safe zone')">🛡️ Safe Trick</span></div></div><div class="card"><h3>🎮 All Games Help</h3><div style="margin-top:8px"><span class="chip" onclick="askChip('Free Fire rank push')">🔥 FF Rank Push</span><span class="chip" onclick="askChip('Free Fire headshot')">🎯 Headshot Trick</span><span class="chip" onclick="askChip('PUBG sensitivity')">🔫 PUBG Sensitivity</span><span class="chip" onclick="askChip('PUBG Conqueror')">🏆 Conqueror</span><span class="chip" onclick="askChip('Roblox robux')">🧱 Roblox</span><span class="chip" onclick="askChip('Carrom trick')">🎯 Carrom</span><span class="chip" onclick="askChip('Hi')">👋 Hi</span></div></div><div class="card"><b>🎨 Image Generate</b><br><input id="pmt" style="width:100%;padding:11px;margin-top:8px;border-radius:10px;background:#222;color:#fff;border:1px solid #333" placeholder="যেমন: ludo star, free fire"><img id="preview" style="display:none"><button class="btn" onclick="gen()">✨ Image বানাও</button><button class="btn" style="background:#222" onclick="dwn()">⬇️ Download</button></div></div>
          <div id="imageTab" style="display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px"><div class="card"><b>📸 Photo Edit Pro</b><br><input type="file" id="fIn" accept="image/*"><div style="margin-top:8px;display:flex;flex-wrap:wrap"><button class="sbtn" onclick="setF('none')">Original</button><button class="sbtn" onclick="setF('grayscale(100%)')">B&W</button><button class="sbtn" onclick="setF('contrast(150%) brightness(110%)')">HD Pro</button></div></div></div>
          <div class="input-area"><span onclick="startV()" style="font-size:22px;cursor:pointer">🎤</span><input id="inp" placeholder="লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো..."><button id="sendBtn">➤</button></div>
          <div style="background:#000;color:#667eea;padding:7px;text-align:center;font-weight:900;font-size:9px;letter-spacing:3px">SADI AI - OFFICIAL - V19 OFFLINE</div>
          <script>
          setTimeout(()=>{document.getElementById('splash').style.display='none'},3000);
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),sendBtn=document.getElementById('sendBtn'),preview=document.getElementById('preview'),fIn=document.getElementById('fIn'),pmt=document.getElementById('pmt');
          let lastImgTime=0;
          function getTime(){return new Date().toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit'})}
          function sC(){chat.style.display='flex';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='none';document.getElementById('tC').classList.add('active');document.getElementById('tG').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sG(){chat.style.display='none';document.getElementById('gameTab').style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('tG').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sI(){chat.style.display='none';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('tI').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tG').classList.remove('active')}
          function addM(t,c){let wrap=document.createElement('div');wrap.style.display='flex';wrap.style.flexDirection='column';wrap.style.alignItems=c==='user'?'flex-end':'flex-start';let d=document.createElement('div');d.className='msg '+c;d.textContent=t;let tm=document.createElement('span');tm.className='time';tm.textContent=getTime();wrap.appendChild(d);wrap.appendChild(tm);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;sC();return d}
          function showTyping(){let w=document.createElement('div');w.id='typing';w.className='typing';w.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';chat.appendChild(w);chat.scrollTop=chat.scrollHeight;return w}
          function initChat(){addM("👋 হ্যালো ভাই!\n\n🎮 আমি সব গেমের ব্যাপারে হেল্প করতে পারি!\n\n🎲 লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো!\nLudo Star, Free Fire, PUBG, Roblox - সব গেমের Pro Tips দেবো!\n\nনিচে Chip এ ক্লিক করো 👇","ai")}
          initChat();
          fIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)}
          function setF(f){preview.style.filter=f}
          function dwn(){if(!preview.src)return alert('ছবি নাই!');let a=document.createElement('a');a.href=preview.src;a.download='sadi-ai.jpg';a.click()}
          function askChip(q){inp.value=q;ask()}
          async function gen(){let raw=(pmt.value.trim()||'');if(!raw)return alert('লিখো!');let now=Date.now(),diff=(now-lastImgTime)/1000;if(diff<46){return alert('45s Wait!')}lastImgTime=now;addM('🎨 '+raw,'user');let finalPrompt=raw;if(raw.toLowerCase().includes('ludo')){finalPrompt='Ludo star board, colorful dice, fun game, 8k, '+raw} else if(raw.toLowerCase().includes('free fire')){finalPrompt='Garena Free Fire character, 8k, '+raw} let ty=showTyping();preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(finalPrompt)+'?seed='+Date.now()+'&width=768&height=768&nologo=true&model=flux';preview.style.display='block';sG();setTimeout(()=>{ty.remove()},1200);}
          function getOfflineAnswer(q){
            let low=q.toLowerCase();
            if(low.includes('hi')||low.includes('hello')||low.includes('হ্যালো')||low.includes('হাই')){return "👋 হ্যালো ভাই! কেমন আছো? 😊\n\n🎮 আমি সব গেমের ব্যাপারে হেল্প করতে পারি!\n\n🎲 লুডু, 🔥 Free Fire, 🔫 PUBG, 🧱 Roblox - যেটা লাগবে বলো!\n\nলুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো!"}
            if(low.includes('ludo')||low.includes('লুডু')){
              if(low.includes('6')||low.includes('ছয়')){return "🎲 Ludo তে 6 আনার Pro Trick:\n\n1. 🎯 একটা Token Home এর কাছে নিয়ে যাও, বারবার একই Token নাড়াও না\n2. 🛡️ Safe Zone এ থাকো, কাটা খাবে না\n3. 🔄 6 পাইলে নতুন Token বের করার আগে পুরোনো Token আগাও\n4. 💡 Trick: Dice টা একটু জোরে Tap করো, অনেক সময় 6 আসে!\n5. 🏆 সব Token একসাথে বের করো না, একটা একটা করে Home করো\n\nআরো Trick লাগলে বলো!"}
              if(low.includes('coin')||low.includes('কয়েন')){return "💰 Ludo Star Free Coin Trick:\n\n1. 🎁 Daily Bonus নাও, প্রতিদিন Login করো\n2. 🎮 Facebook Friends Invite করো\n3. 🏆 Tournament খেলো, জিতলে অনেক Coin\n4. 📺 Video Ad দেখো, Free Coin দেয়\n5. 💎 Safe খেলো, হারালে Coin যায়\n\nCoin বাঁচাতে Low Bet Table এ খেলো প্রথমে!"}
              return "🏆 Ludo Star / Ludo King জেতার Pro Trick:\n\n1. 🛡️ SAFE ZONE TRICK: সবসময় Star ★ ঘরে থাকার চেষ্টা করো, ওখানে কেউ কাটতে পারবে না!\n\n2. 🎲 TOKEN MANAGEMENT:\n   - সব Token একসাথে বের করো না\n   - একটা Token Home এর কাছে নাও, তারপর আরেকটা বের করো\n   - একটা Token Safe Zone এ রাখো\n\n3. ⚔️ কখন মারবে:\n   - প্রতিপক্ষ Home এর কাছে গেলে কেটে দাও\n   - নিজের Token Safe থাকলে তবেই Attack করো\n\n4. 🎯 6 পাওয়ার পর: নতুন Token না বের করে আগের Token আগাও, জেতা সহজ হবে!\n\n5. 💰 Coin বাঁচাতে: প্রথমে ছোট Table এ খেলো!\n\nআরো কিছু জানতে চাও ভাই?"
            }
            if(low.includes('free fire')||low.includes('ff')||low.includes('ফ্রি ফায়ার')){
              if(low.includes('headshot')||low.includes('হেডশট')){return "🎯 Free Fire Headshot Trick:\n\n1. 🔫 Sensitivity: General 90-100, Red Dot 85-90, 2x Scope 75-80\n2. 🎯 Aim: সবসময় মাথার লেভেলে Aim রাখো\n3. 🔥 Drag Shot: Fire Button উপরের দিকে Drag করো\n4. 🧍 Character: Hayato + Kelly + Moco + Jota\n5. 🎮 Practice: Training Ground এ 15 মিনিট Daily\n\nGun: MP40, M1887, Desert Eagle best for headshot!"}
              return "🔥 Free Fire Rank Push Trick (Heroic):\n\n1. 👤 Character: Alok / Wukong + Jota + Kelly + Hayato\n2. 🔫 Gun: MP40 + M1887 / SCAR + MP40\n3. 🗺️ Map: Bermuda, Safe Zone এর Edge এ থাকো\n4. 🎯 Strategy: প্রথমে Loot, তারপর 3rd Party Kill\n5. 🧱 Gloo Wall: সবসময় 200+ Gloo রাখো, 1v1 এ Use করো\n6. ⏰ Time: রাত 10PM-2AM Rank Push best\n\nআরো Detail লাগলে বলো!"
            }
            if(low.includes('pubg')||low.includes('পাবজি')){
              if(low.includes('sensitivity')||low.includes('সেনসিটিভিটি')){return "🔫 PUBG Mobile Best Sensitivity (No Gyro):\n\nCamera: TPP 95-100%, FPP 95%\nADS: TPP No Scope 110%, Red Dot 55%, 3x 25%, 6x 18%\nFire: Same as ADS\n\nGyro Player:\n3rd Person 300%, Red Dot 300%, 3x 180%\n\nCode: 7307-1085-6788-4282-435 (Best Control)\n\nRecoil Control: Thumb + Gyro একসাথে Use করো!"}
              return "🏆 PUBG Conqueror Trick:\n\n1. 🗺️ Map: Erangel Classic, Hot Drop Avoid করো\n2. 🔫 Gun: M416 + UMP / M416 + DBS\n3. 🎯 Play: 10+ Match Daily, Top 10 এ থাকো\n4. 👥 Squad: Fixed Squad নিয়ে খেলো, Random না\n5. ⏰ Time: Season এর প্রথম 7 দিন Push করো\n6. 📊 Points: KD 4+ রাখো, Survival Time Important\n\nSensitivity লাগলে বলো!"
            }
            if(low.includes('roblox')||low.includes('রোব্লক্স')){
              return "🧱 Roblox Free Robux & Best Games:\n\n💰 Robux Free (Legal Way):\n1. Microsoft Rewards - Bing Search করে Points\n2. Roblox Premium - Monthly Robux\n3. Game Pass / T-Shirt বানিয়ে Sell\n4. Please Donate Game এ AFK\n\n🎮 Best Obby Games:\n- Mega Easy Obby, Escape Running Head, Tower of Hell\n\n💡 Tip: Free Robux Generator সব Fake, ওগুলোতে যেও না!"
            }
            if(low.includes('carrom')||low.includes('ক্যারাম')){
              return "🎯 Carrom Pool Direct Shot Trick:\n\n1. 🎯 Aim: White Striker মাঝখানে রাখো\n2. 💥 Power: 70-80% Power Use করো\n3. 🎱 Angle: 45 Degree Angle Best\n4. 🏆 Trick: Queen এর পিছনে Striker মারো\n5. 🎮 Practice: Freestyle Mode এ Practice করো\n\nStriker: Striker ভালো হলে Shot ভালো যাবে!"
            }
            return "😊 ভাই, আমি সব গেমের ব্যাপারে হেল্প করতে পারি!\n\n🎲 Ludo Star - জেতার Trick, 6 Trick, Safe Zone\n🔥 Free Fire - Rank Push, Headshot, Sensitivity\n🔫 PUBG Mobile - Sensitivity Code, Conqueror Trick\n🧱 Roblox - Free Robux, Best Obby\n🎯 Carrom Pool - Direct Shot Trick\n\nতুমি কোন গেম নিয়ে জানতে চাও? নাম লিখো! 👇\nযেমন: Ludo Star জেতার trick দাও"
          }
          async function ask(q){
            q=q||inp.value.trim();if(!q)return;addM(q,'user');inp.value='';
            let typingEl=showTyping();
            let offlineAns=getOfflineAnswer(q);
            setTimeout(()=>{typingEl.remove();addM(offlineAns,'ai');},800);
            try{
              let expertPrompt="You are BEST gaming helper. Help with Ludo, FF, PUBG, Roblox, Carrom. Rules: Never say you are SADI AI. Direct helpful answer in Bangla mixed English, points, emoji. User: "+q;
              let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(expertPrompt));
              if(r.ok){let t=await r.text();if(t && !t.includes('503') && !t.includes('SERVICE_UNAVAILABLE') && t.length>20 && t.length<2000){setTimeout(()=>{let last=document.querySelector('#chat div:last-child .msg.ai');if(last) last.textContent=t},1500)}}
            }catch(e){}
          }
          sendBtn.onclick=()=>ask();inp.onkeypress=e=>{if(e.key==='Enter')ask()}
          function startV(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Chrome ব্যবহার করো');let r=new SR();r.lang='bn-BD';r.onresult=e=>{inp.value=e.results[0][0].transcript;ask()};r.start()}
          </script></body></html>
          HTMLEND
          echo '{"appId":"com.myaisadi.app","appName":"SADI AI","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: SADI-AI-V19-Offline-Fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
