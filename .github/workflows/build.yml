name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build V8 Ultimate
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadi V8 Ultimate</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}.header{background:linear-gradient(135deg,#667eea,#764ba2);padding:10px;display:flex;justify-content:space-around;font-weight:bold;font-size:12px}.active{background:#fff!important;color:#764ba2!important;border-radius:20px;padding:6px 12px}#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 14px;border-radius:12px;max-width:85%;font-size:14px;white-space:pre-wrap}.user{background:#667eea;align-self:flex-end;color:#fff}.ai{background:#222;align-self:flex-start;color:#fff}#imageTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px}.card{background:#1e1e1e;padding:12px;border-radius:12px;border:1px solid #333}img#preview{max-width:100%;border-radius:10px;margin-top:8px;transition:.3s}input[type=range]{width:100%}button{cursor:pointer}.btn{width:100%;padding:12px;background:#667eea;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:6px}.sbtn{padding:6px 10px;border:none;border-radius:6px;background:#333;color:#fff;margin:2px}.sbtn.active{background:#667eea}#timer{display:none;background:#ff5722;color:#fff;padding:8px;text-align:center;font-weight:bold}.input-area{display:flex;padding:10px;background:#000;gap:6px}#inp{flex:1;padding:12px;border-radius:25px;background:#222;color:#fff;border:1px solid #333}</style></head><body>
          <div class="header"><span id="tC" class="active" onclick="sC()">💬 Chat</span><span id="tI" onclick="sI()">🎨 Edit+Generate</span><span id="tV" onclick="sV()">🎤 Voice</span></div>
          <div id="timer"></div>
          <div id="chat"><div class="msg ai">I am Sadi V8 ULTIMATE by SADI DEVELOPER! 🥳 আমি সব পারি: Free Fire Image বানানো + Photo Edit + Voice + Chat!</div></div>
          <div id="imageTab">
            <div class="card">
              <b>1. নিজের ছবি Edit:</b><br><input type="file" id="fIn" accept="image/*"><img id="preview" style="display:none">
              <div style="margin-top:8px;display:flex;flex-wrap:wrap"><button class="sbtn" onclick="setF('none')">Original</button><button class="sbtn" onclick="setF('grayscale(100%)')">B&W</button><button class="sbtn" onclick="setF('sepia(100%)')">Sepia</button><button class="sbtn" onclick="setF('contrast(150%) brightness(110%)')">HD</button><button class="sbtn" onclick="setF('blur(2px)')">Blur</button><button class="sbtn" onclick="setF('invert(100%)')">Invert</button><button class="sbtn" onclick="setF('hue-rotate(90deg)')">Color</button></div>
              <div style="margin-top:10px"><label>Brightness: <span id="bVal">100</span>%</label><input type="range" id="bright" min="0" max="200" value="100" oninput="updateEdit()"><label>Contrast: <span id="cVal">100</span>%</label><input type="range" id="contrast" min="0" max="200" value="100" oninput="updateEdit()"></div>
            </div>
            <div class="card">
              <b>2. AI দিয়ে নতুন ছবি বানাও:</b><br><input id="pmt" style="width:100%;padding:10px;margin-top:6px;border-radius:8px;background:#333;color:#fff;border:1px solid #555" placeholder="লিখো: free fire, cat, biral, beautiful girl"><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px"><button class="sbtn" style="background:#ff5722" onclick="quick('free fire')">🔥 Free Fire</button><button class="sbtn" style="background:#ff5722" onclick="quick('free fire character with mp40 gun and gloo wall, anime style')">🔫 FF Gun</button><button class="sbtn" onclick="quick('cute cat')">🐱 Cat</button><button class="sbtn" onclick="quick('beautiful girl, viral photo')">👧 Girl</button><button class="sbtn" onclick="quick('pubg character')">PUBG</button></div>
              <button class="btn" onclick="gen()">✨ AI Image বানাও / Edit Apply</button><button class="btn" style="background:#fff;color:#000" onclick="dwn()">⬇️ Download ছবি</button><div style="font-size:10px;color:#888;margin-top:5px">Free Fire এর জন্য ইংলিশে 'free fire' লিখো, বাংলায় লিখলে Auto Translate হবে!</div>
            </div>
          </div>
          <div id="voiceTab" style="display:none;flex:1;padding:12px;flex-direction:column;align-items:center;justify-content:center"><div class="card" style="width:100%;text-align:center"><h2>🎤 Voice Mode</h2><button id="micBtn" style="font-size:40px;width:90px;height:90px;border-radius:50%;border:none;background:#667eea;color:#fff;margin:15px">🎤</button><p id="vStatus">Ready...</p><button class="btn" onclick="speakLast()">🔊 শেষ উত্তর শুনো</button><button class="btn" style="background:#333" onclick="stopS()">🔇 থামাও</button></div></div>
          <div class="input-area"><span onclick="startV()" style="font-size:22px;cursor:pointer">🎤</span><input id="inp" placeholder="প্রশ্ন করো..."><button id="snd" style="background:#667eea;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:bold">SEND</button></div>
          <div style="background:#000;color:#fff;padding:6px;text-align:center;font-weight:bold;font-size:11px;letter-spacing:2px">SADI DEVELOPER - V8 ULTIMATE</div>
          <script>
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),snd=document.getElementById('snd'),preview=document.getElementById('preview'),fIn=document.getElementById('fIn'),pmt=document.getElementById('pmt'),timer=document.getElementById('timer'),vStatus=document.getElementById('vStatus'),micBtn=document.getElementById('micBtn');
          let lastImgTime=0,lastAiText="I am Sadi V8 Ultimate",currentFilter='none',bright=100,contrast=100;
          function sC(){chat.style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('voiceTab').style.display='none';document.getElementById('tC').classList.add('active');document.getElementById('tI').classList.remove('active');document.getElementById('tV').classList.remove('active')}
          function sI(){chat.style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('voiceTab').style.display='none';document.getElementById('tI').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tV').classList.remove('active')}
          function sV(){chat.style.display='none';document.getElementById('imageTab').style.display='none';document.getElementById('voiceTab').style.display='flex';document.getElementById('tV').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function addM(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(c=='ai')lastAiText=t;return d}
          fIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block';updateEdit()};r.readAsDataURL(f)}
          function setF(f){currentFilter=f;updateEdit()}
          function updateEdit(){let b=document.getElementById('bright').value;let c=document.getElementById('contrast').value;document.getElementById('bVal').textContent=b;document.getElementById('cVal').textContent=c;bright=b;contrast=c;let filter=currentFilter;if(filter=='none')filter='';preview.style.filter=filter+' brightness('+b+'%) contrast('+c+'%)';}
          function dwn(){if(!preview.src||preview.style.display=='none')return alert('ছবি নাই ভাই!');let canvas=document.createElement('canvas');let img=new Image();img.crossOrigin='anonymous';img.onload=()=>{canvas.width=img.width;canvas.height=img.height;let ctx=canvas.getContext('2d');ctx.filter=preview.style.filter;ctx.drawImage(img,0,0);let a=document.createElement('a');a.href=canvas.toDataURL('image/jpeg');a.download='sadi-v8-'+Date.now()+'.jpg';a.click()};img.onerror=()=>{let a=document.createElement('a');a.href=preview.src;a.download='sadi-v8.jpg';a.click()};img.src=preview.src}
          function quick(t){pmt.value=t;gen()}
          function showTimer(s){timer.style.display='block';let c=s;let it=setInterval(()=>{timer.textContent='⏳ '+c+'s Wait...';c--;if(c<0){clearInterval(it);timer.style.display='none'}},1000)}
          async function translate(text){try{if(!/[ঀ-৿]/.test(text))return text;let res=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=bn|en');let data=await res.json();return data.responseData.translatedText||text}catch(e){return text}}
          async function gen(){let raw=(pmt.value.trim()||inp.value.trim()||'');if(!raw)return alert('কি বানাবো লিখো!');let low=raw.toLowerCase();let now=Date.now(),diff=(now-lastImgTime)/1000;if(diff<46 && !low.includes('cat') && !low.includes('biral') && !low.includes('বিড়াল') && !low.includes('বিড়াল')){showTimer(Math.ceil(46-diff));return alert('45s Wait করো ভাই! Cat লিখলে Unlimited!')}
          lastImgTime=now;addM('🎨 '+raw,'user');let eng=await translate(raw);let finalPrompt=eng;if(low.includes('free fire')||low.includes('ফ্রী ফায়ার')||low.includes('ফ্রি ফায়ার')||low.includes('ff')){finalPrompt='Garena Free Fire game character, battle royale outfit, holding MP40 gun, gloo wall, gaming background, highly detailed, 8k, anime style, '+eng.replace(/free fire/gi,'')}else{finalPrompt=eng+', high quality, 8k, photorealistic, detailed'}let ty=addM('✅ Generating: '+eng,'ai');if(low.includes('বিড়াল')||low.includes('বিড়াল')||low.includes('biral')||low.includes('cat')){preview.src='https://cataas.com/cat?'+Date.now()}else{preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(finalPrompt)+'?seed='+Math.floor(Math.random()*99999)+'&width=768&height=768&nologo=true&model=flux'}preview.style.display='block';updateEdit();sI();ty.textContent='✅ Image Ready! নিচে Edit করতে পারো, Brightness বাড়াও কমাও, তারপর Download দাও!'}
          async function ask(q){q=q||inp.value.trim();if(!q)return;addM(q,'user');inp.value='';let ty=addM('...','ai');try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q));let t=await r.text();ty.textContent=t;lastAiText=t;let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';speechSynthesis.speak(u);}catch(e){ty.textContent='আমি Sadi V8 Ultimate AI!'}};snd.onclick=()=>ask();inp.onkeypress=e=>{if(e.key==='Enter')ask()}
          function speakLast(){let u=new SpeechSynthesisUtterance(lastAiText);u.lang='bn-BD';speechSynthesis.speak(u)}function stopS(){speechSynthesis.cancel()}
          function startV(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Chrome ব্যবহার করো');let r=new SR();r.lang='bn-BD';r.onstart=()=>{vStatus.textContent='🎤 শুনছি...';micBtn.textContent='🔴'};r.onresult=e=>{let t=e.results[0][0].transcript;inp.value=t;pmt.value=t;vStatus.textContent='✅ '+t;ask(t)};r.onend=()=>{micBtn.textContent='🎤';vStatus.textContent='Ready...'};r.start()}micBtn.onclick=startV;
          </script></body></html>
          HTMLEND
          echo '{"appId":"com.myaisadi.app","appName":"My AI Sadi V8 Ultimate","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: My-AI-Sadi-V8-Ultimate-All-in-One
          path: android/app/build/outputs/apk/debug/app-debug.apk
