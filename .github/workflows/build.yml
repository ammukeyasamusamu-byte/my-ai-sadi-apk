x-start;color:#fff}#imageTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:12px}.card{background:#1a1a1a;padding:12px;border-radius:12px;border:1px solid #2a2a2a}img#preview{max-width:100%;border-radius:10px;margin-top:8px;transition:.3s}input[type=range]{width:100%;accent-color:#667eea}.btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:6px}.sbtn{padding:7px 12px;border:none;border-radius:8px;background:#2a2a2a;color:#fff;margin:3px;font-size:12px}.sbtn:active{background:#667eea}#timer{display:none;background:#ff5722;color:#fff;padding:8px;text-align:center;font-weight:bold}.input-area{display:flex;padding:10px;background:#111;gap:6px;border-top:1px solid #222}#inp{flex:1;padding:12px;border-radius:25px;background:#222;color:#fff;border:1px solid #333;outline:none}.badge{font-size:9px;background:#ff5722;padding:2px 6px;border-radius:10px;margin-left:5px}</style></head><body>
