name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#eef2ff;height:100vh;display:flex;flex-direction:column}.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:16px;text-align:center;font-size:22px;font-weight:bold}#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}.msg{padding:12px 16px;border-radius:18px;max-width:85%}.user{background:#667eea;color:#fff;align-self:flex-end}.ai{background:#fff;color:#333;align-self:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.1)}.input-area{display:flex;padding:12px;background:#fff;gap:8px}#input{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #ddd;outline:none}#send{background:#667eea;color:#fff;border:none;padding:0 22px;border-radius:25px;font-weight:bold}.footer{background:#000;color:#fff;padding:10px;text-align:center;letter-spacing:2px;font-weight:bold;font-size:13px}</style></head><body><div class="header">My AI Sadi 🤖</div><div id="chat"><div class="msg ai">Hey! I am My AI Sadi, created by SADI DEVELOPER!</div></div><div class="input-area"><input id="input" placeholder="Type message..."><button id="send">SEND</button></div><div class="footer">SADI DEVELOPER</div><script>const chat=document.getElementById("chat"),input=document.getElementById("input"),send=document.getElementById("send");function addMsg(t,c){const d=document.createElement("div");d.className="msg "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function askAI(){const q=input.value.trim();if(!q)return;addMsg(q,"user");input.value="";const ty=document.createElement("div");ty.className="msg ai";ty.textContent="Sadi is thinking...";chat.appendChild(ty);chat.scrollTop=chat.scrollHeight;setTimeout(()=>{let r="";const l=q.toLowerCase();if(l.includes("hi")||l.includes("hello"))r="Hello 👋 I am Sadi AI!";else if(l.includes("who are you"))r="I am My AI Sadi, built by SADI DEVELOPER!";else if(l.includes("bangla"))r="হ্যাঁ ভাই! বাংলা বুঝি!";else r="You said: "+q+" - I am Sadi AI!";ty.textContent=r},800)}send.onclick=askAI;input.onkeypress=e=>{if(e.key==="Enter")askAI()};</script></body></html>' > www/index.html
          echo '{"appId":"com.myaisadi.app","appName":"My AI Sadi","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: My-AI-Sadi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
