name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build V5 PRO
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadi V5 PRO</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#eef2ff;height:100vh;display:flex;flex-direction:column}.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:10px;text-align:center;font-weight:bold;display:flex;justify-content:space-around;font-size:13px}.header span{cursor:pointer;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.2)}.active{background:#fff!important;color:#764ba2!important}#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 14px;border-radius:18px;max-width:85%;white-space:pre-wrap;font-size:14px}.user{background:#667eea;color:#fff;align-self:flex-end}.ai{background:#fff;color:#333;align-self:flex-start;box-shadow:0 2px 6px rgba(0,0,0,.1)}#imageTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px}.card{background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}img#preview{max-width:100%;border-radius:10px;margin-top:8px}.btn{width:100%;margin-top:8px;padding:11px;border-radius:8px;border:none;background:#667eea;color:#fff;font-weight:bold}.sbtn{padding:6px 10px;border:none;border-radius:6px;background:#667eea;color:#fff;margin:2px}#timer{display:none;background:#ff5722;color:#fff;padding:8px;text-align:center;font-size:12px;font-weight:bold}.input-area{display:flex;padding:10px;background:#fff;gap:6px;align-items:center}#inp{flex:1;padding:12px 16px;border-radius:25px;border:1px solid #ddd;outline:none}.icon{font-size:22px;padding:8px;cursor:pointer}</style></head><body>
          <div class="header"><span id="tC" class="active" onclick="sC()">💬 Chat</span><span id="tI" onclick="sI()">🎨 Photo</span><span id="tV" onclick="sV()">🎤 Voice</span><span>Sadi V5</span></div>
          <div id="timer"></div>
          <div id="chat"><div class="msg ai">I am My AI Sadi V5 PRO by SADI DEVELOPER! 🥳 Chat + Image + Voice সব পারি!</div></div>
          <div id="imageTab"><div class="card"><input type="file" id="fIn" accept="image/*"><img id="preview" style="display:none"><div style="margin-top:8px"><button class="sbtn" onclick="flt('none')">Original</button><button class="sbtn" onclick="flt('grayscale(100%)')">B&W</button><button class="sbtn" onclick="flt('sepia(100%)')">Sepia</button><button class="sbtn" onclick="flt('contrast(150%) brightness(110%)')">HD</button><button class="sbtn" onclick="flt('blur(2px)')">Blur</button></div><input id="pmt" style="width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #ddd" placeholder="যেমন: cat, viral girl, biral"><button class="btn" onclick="gen()">✨ AI Image বানাও</button><button class="btn" style="background:#000" onclick="dwn()">⬇️ Download</button></div></div>
          <div id="voiceTab" style="display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px;align-items:center;justify-content:center"><div class="card" style="text-align:center;width:100%"><h2>🎤 Voice Mode</h2><p style="font-size:12px;color:#666;margin:8px 0">মাইকে চাপ দাও, কথা বলো, AI উত্তর মুখে বলবে!</p><button id="micBtn" style="font-size:50px;padding:20px;border-radius:50%;border:none;background:#667eea;color:#fff;width:100px;height:100px">🎤</button><p id="voiceStatus" style="margin-top:10px;font-weight:bold">Ready...</p><button class="btn" onclick="speakLast()">🔊 শেষ উত্তর আবার শুনো</button><button class="btn" style="background:#ff5722" onclick="stopSpeak()">🔇 থামাও</button></div></div>
          <div class="input-area"><span class="icon" onclick="startVoice()">🎤</span><input id="inp" placeholder="লিখো বা 🎤 বলো..."><span class="icon" onclick="speakLast()">🔊</span><button id="snd" style="background:#667eea;color:#fff;border:none;padding:10px 18px;border-radius:25px;font-weight:bold">SEND</button></div>
          <div style="background:#000;color:#fff;padding:6px;text-align:center;font-weight:bold;letter-spacing:2px;font-size:11px">SADI DEVELOPER - V5 PRO</div>
          <script>
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),snd=document.getElementById('snd'),preview=document.getElementById('preview'),fIn=document.getElementById('fIn'),pmt=document.getElementById('pmt'),timer=document.getElementById('timer'),voiceStatus=document.getElementById('voiceStatus'),micBtn=document.getElementById('micBtn');
          let lastAiText="I am My AI Sadi V5 PRO",lastImgTime=0,recognition;
          function sC(){chat.style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('voiceTab').style.display='none';document.getElementById('tC').classList.add('active');document.getElementById('tI').classList.remove('active');document.getElementById('tV').classList.remove('active')}
          function sI(){chat.style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('voiceTab').style.display='none';document.getElementById('tI').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tV').classList.remove('active')}
          function sV(){chat.style.display='none';document.getElementById('imageTab').style.display='none';document.getElementById('voiceTab').style.display='flex';document.getElementById('tV').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function addM(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(c=='ai')lastAiText=t;return d}
          fIn.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)}
          function flt(f){preview.style.filter=f}
          function dwn(){if(!preview.src||preview.style.display=='none')return alert('ছবি নাই!');const a=document.createElement('a');a.href=preview.src;a.download='sadi-v5.jpg';a.click()}
          function showTimer(s){timer.style.display='block';let c=s;const it=setInterval(()=>{timer.textContent='⏳ '+c+'s Wait...';c--;if(c<0){clearInterval(it);timer.style.display='none'}},1000)}
          function gen(){let q=(pmt.value.trim()||inp.value.trim()||'').toLowerCase();if(!q)return alert('কি ছবি লিখো!');let now=Date.now(),diff=(now-lastImgTime)/1000;if(diff<46 && !q.includes('বিড়াল') && !q.includes('বিড়াল') && !q.includes('biral') && !q.includes('cat')){showTimer(Math.ceil(46-diff));return alert('45s Wait! বিড়াল লিখলে Unlimited!')}lastImgTime=now;addM('🎨 '+q,'user');sC();if(q.includes('বিড়াল')||q.includes('বিড়াল')||q.includes('biral')||q.includes('cat')||q.includes('বিডাল')){preview.src='https://cataas.com/cat?'+Date.now();preview.style.display='block';addM('✅ বিড়াল Ready! Photo Tab এ দেখো 🐱','ai');sI();return}preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(q)+'?seed='+Math.floor(Math.random()*99999)+'&nologo=true';preview.style.display='block';addM('✅ Generating... Photo Tab এ দেখো','ai');sI()}
          async function askAI(text){let q=text||inp.value.trim();if(!q)return;addM(q,'user');inp.value='';let ty=addM('...','ai');try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q));let t=await r.text();ty.textContent=t;lastAiText=t;speak(t)}catch(e){ty.textContent='আমি Sadi AI! তুমি বললে: '+q}chat.scrollTop=chat.scrollHeight}
          snd.onclick=()=>askAI();inp.onkeypress=e=>{if(e.key==='Enter')askAI()}
          // VOICE
          function speak(txt){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang='bn-BD';u.rate=1;window.speechSynthesis.speak(u)}
          function speakLast(){speak(lastAiText)}
          function stopSpeak(){window.speechSynthesis.cancel()}
          function startVoice(){if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){alert('Voice এই ফোনে Support করে না, Chrome ব্যবহার করো');return}let SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='bn-BD';recognition.onstart=()=>{voiceStatus.textContent='🎤 শুনছি... বলো ভাই!';micBtn.textContent='🔴'};recognition.onresult=e=>{let t=e.results[0][0].transcript;inp.value=t;voiceStatus.textContent='✅ পেলাম: '+t;addM(t,'user');askAI(t)};recognition.onend=()=>{micBtn.textContent='🎤';voiceStatus.textContent='Ready...'};recognition.onerror=e=>{voiceStatus.textContent='Error: '+e.error};recognition.start()}
          micBtn.onclick=startVoice;
          </script></body></html>
          HTMLEND
          echo '{"appId":"com.myaisadi.app","appName":"My AI Sadi V5 PRO","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: My-AI-Sadi-V5-PRO-Voice-Image-Edit
          path: android/app/build/outputs/apk/debug/app-debug.apk
