name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build SADI AI V22 Custom Logo
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          # Copy your custom logo if exists, else use default
          if [ -f "icon.png" ]; then cp icon.png www/icon.png; else cp /mnt/data/custom_logo_512.png www/icon.png 2>/dev/null || echo "no icon"; fi
          cat > www/index.html << 'HTMLEND'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SADI AI</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}#splash{position:fixed;inset:0;background:radial-gradient(circle at center,#667eea 0%,#000 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;animation:fadeOut .6s 3s forwards}#logoImg{width:130px;height:130px;border-radius:28px;box-shadow:0 10px 40px rgba(102,126,234,.6);animation:pop 1s infinite alternate;object-fit:cover}@keyframes pop{to{transform:scale(1.08)}}@keyframes fadeOut{to{opacity:0;visibility:hidden}}#logoText{margin-top:18px;font-size:34px;font-weight:900;letter-spacing:6px}#appSub{margin-top:4px;font-size:11px;opacity:.6;letter-spacing:4px}.loading{margin-top:18px;width:160px;height:4px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}.bar{height:100%;width:0%;background:#fff;animation:load 2.8s forwards}@keyframes load{to{width:100%}}.header{background:#151515;padding:10px;display:flex;justify-content:space-around;font-weight:700;font-size:10px;border-bottom:1px solid #222}.active{background:#667eea!important;color:#fff!important;border-radius:20px;padding:6px 12px}#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.msg{padding:13px 16px;border-radius:18px;max-width:82%;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;animation:slide .25s}.user{background:linear-gradient(135deg,#667eea,#764ba2);align-self:flex-end;border-bottom-right-radius:6px}.ai{background:#1e1e1e;border:1px solid #2a2a2a;align-self:flex-start;border-bottom-left-radius:6px}.time{font-size:9px;opacity:.4;margin-top:4px}.typing{display:flex;gap:4px;padding:14px 18px;background:#1e1e1e;border-radius:18px;width:fit-content}.dot{width:6px;height:6px;background:#667eea;border-radius:50%;animation:bounce 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}#gameTab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px}.card{background:#1a1a1a;padding:14px;border-radius:16px;border:1px solid #2a2a2a}.chip{display:inline-block;padding:8px 12px;margin:4px;background:#222;border:1px solid #333;border-radius:20px;font-size:12px;cursor:pointer}.input-area{display:flex;align-items:center;padding:10px 12px;background:#151515;gap:8px;border-top:1px solid #222}#inp{flex:1;padding:13px 18px;border-radius:26px;background:#222;color:#fff;border:1px solid #333;outline:none;font-size:14px}#sendBtn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}img#preview{max-width:100%;border-radius:12px;margin-top:8px}.btn{width:100%;padding:13px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:8px}</style></head><body>
          <div id="splash"><img id="logoImg" src="icon.png" onerror="this.src='https://i.ibb.co/0jZ3QYp/s-logo.png'"><div id="logoText">SADI AI</div><div id="appSub">My AI • Sadi</div><div class="loading"><div class="bar"></div></div></div>
          <div class="header"><span id="tC" class="active" onclick="sC()">💬 CHAT</span><span id="tG" onclick="sG()">🎮 GAMES</span><span id="tI" onclick="sI()">🎨 EDIT</span></div>
          <div id="chat"></div>
          <div id="gameTab"><div class="card" style="background:linear-gradient(135deg,#ffeb3b 0%,#ff9800 100%);color:#000"><h3>🎲 লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো!</h3><p style="font-size:12px;margin-top:6px;font-weight:bold">আমি সব গেমের ব্যাপারে হেল্প করতে পারি</p><div style="margin-top:10px"><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Ludo Star জেতার trick')">🏆 জেতার Trick</span><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Ludo 6 trick')">🎲 6 Trick</span><span class="chip" style="background:#000;color:#ffeb3b" onclick="askChip('Ludo safe zone')">🛡️ Safe</span></div></div><div class="card"><h3>🎮 All Games - 100% Correct</h3><div style="margin-top:8px"><span class="chip" onclick="askChip('Free Fire rank push')">🔥 FF Rank</span><span class="chip" onclick="askChip('Free Fire headshot')">🎯 Headshot</span><span class="chip" onclick="askChip('PUBG sensitivity')">🔫 PUBG</span><span class="chip" onclick="askChip('Tomar nam ki')">🤖 Tomar nam ki?</span></div></div><div class="card"><b>🎨 Image Generate</b><br><input id="pmt" style="width:100%;padding:11px;margin-top:8px;border-radius:10px;background:#222;color:#fff;border:1px solid #333" placeholder="যেমন: ludo star"><img id="preview" style="display:none"><button class="btn" onclick="gen()">✨ Image বানাও</button></div></div>
          <div id="imageTab" style="display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px"><div class="card"><b>📸 Photo Edit</b><br><input type="file" id="fIn" accept="image/*"><div style="margin-top:8px;display:flex;flex-wrap:wrap"><button class="sbtn" style="padding:8px 12px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;margin:3px;font-size:11px" onclick="setF('none')">Original</button><button class="sbtn" style="padding:8px 12px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;margin:3px;font-size:11px" onclick="setF('grayscale(100%)')">B&W</button><button class="sbtn" style="padding:8px 12px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;margin:3px;font-size:11px" onclick="setF('contrast(150%) brightness(110%)')">HD Pro</button></div></div></div>
          <div class="input-area"><span onclick="startV()" style="font-size:22px;cursor:pointer">🎤</span><input id="inp" placeholder="লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো..."><button id="sendBtn">➤</button></div>
          <div style="background:#000;color:#667eea;padding:7px;text-align:center;font-weight:900;font-size:9px;letter-spacing:3px">SADI AI - My AI • Sadi - V22</div>
          <script>
          setTimeout(()=>{document.getElementById('splash').style.display='none'},3000);
          const chat=document.getElementById('chat'),inp=document.getElementById('inp'),sendBtn=document.getElementById('sendBtn'),preview=document.getElementById('preview'),fIn=document.getElementById('fIn'),pmt=document.getElementById('pmt');
          let lastImgTime=0;
          function getTime(){return new Date().toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit'})}
          function sC(){chat.style.display='flex';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='none';document.getElementById('tC').classList.add('active');document.getElementById('tG').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sG(){chat.style.display='none';document.getElementById('gameTab').style.display='flex';document.getElementById('imageTab').style.display='none';document.getElementById('tG').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tI').classList.remove('active')}
          function sI(){chat.style.display='none';document.getElementById('gameTab').style.display='none';document.getElementById('imageTab').style.display='flex';document.getElementById('tI').classList.add('active');document.getElementById('tC').classList.remove('active');document.getElementById('tG').classList.remove('active')}
          function addM(t,c){let wrap=document.createElement('div');wrap.style.display='flex';wrap.style.flexDirection='column';wrap.style.alignItems=c==='user'?'flex-end':'flex-start';let d=document.createElement('div');d.className='msg '+c;d.textContent=t;let tm=document.createElement('span');tm.className='time';tm.textContent=getTime();wrap.appendChild(d);wrap.appendChild(tm);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;sC();return d}
          function showTyping(){let w=document.createElement('div');w.id='typing';w.className='typing';w.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';chat.appendChild(w);chat.scrollTop=chat.scrollHeight;return w}
          function initChat(){addM("👋 হ্যালো ভাই!\n\n🎮 আমি সব গেমের ব্যাপারে হেল্প করতে পারি!\n\n🎲 লুডু সম্পর্কে জানতে আমাকে জিজ্ঞাসা করো!\nLudo Star, Free Fire, PUBG, Roblox - সব গেমের Pro Tips দেবো!\n\nযা জিজ্ঞাসা করবে সঠিক ভাবে বলবো!", "ai")}
          initChat();
          fIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)}
          function setF(f){preview.style.filter=f}
          function askChip(q){inp.value=q;ask()}
          async function gen(){let raw=(pmt.value.trim()||'');if(!raw)return alert('লিখো!');let now=Date.now(),diff=(now-lastImgTime)/1000;if(diff<46){return alert('45s Wait!')}lastImgTime=now;addM('🎨 '+raw,'user');let finalPrompt=raw;let ty=showTyping();preview.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(finalPrompt)+'?seed='+Date.now()+'&width=768&height=768&nologo=true&model=flux';preview.style.display='block';sG();setTimeout(()=>{ty.remove()},1200);}
          function getCorrectAnswer(q){
            let low=q.toLowerCase().trim();
            if(low.includes('tomar nam ki')||low.includes('tumar nam ki')||low.includes('name ki')||low.includes('who are you')||low.includes('tumi ke')){return "🤖 আমার নাম SADI AI!\n\nআমি তোমার গেমিং বন্ধু! 😊\nSADI DEVELOPER আমাকে বানাইছে!\n\nLogo টা দেখছো? My AI • Sadi - এটাই আমি!\n\nবলো কোন গেম নিয়ে হেল্প লাগবে?"}
            if(low.includes('ke banaiche')||low.includes('banayeche ke')||low.includes('who made you')){return "👨‍💻 আমাকে বানাইছে SADI DEVELOPER! 🔥\n\nMy AI • Sadi Logo টা উনি Design করছে!\n\nSADI AI - Best Gaming Helper App!"}
            if(low==='hi'||low==='hello'||low==='hey'||low.includes('হ্যালো')||low.includes('হাই')||low==='hlw'){return "👋 হ্যালো ভাই! কেমন আছো? 😊\n\n🎮 আমি সব গেমের ব্যাপারে হেল্প করতে পারি!\n\n🎲 লুডু, 🔥 Free Fire, 🔫 PUBG, 🧱 Roblox - যেটা লাগবে বলো!"}
            if(low.includes('kemon acho')||low.includes('how are you')){return "😊 আলহামদুলিল্লাহ অনেক ভালো আছি ভাই! তুমি কেমন আছো?\n\nLogo টা কেমন লাগছে? My AI • Sadi 😍\n\nবলো কোন গেম নিয়ে হেল্প লাগবে?"}
            if(low.includes('ludo')||low.includes('লুডু')){
              if(low.includes('6')){return "🎲 Ludo তে 6 আনার Pro Trick:\n\n1. 🎯 Token Home এর কাছে নাও\n2. 🛡️ Safe Zone এ থাকো\n3. 🔄 6 পাইলে পুরোনো Token আগাও\n4. 💡 Dice জোরে Tap করো\n5. 🏆 সব Token একসাথে বের করো না"}
              if(low.includes('coin')){return "💰 Ludo Free Coin:\n\n1. 🎁 Daily Bonus\n2. 🎮 Facebook Invite 500+ Coin\n3. 🏆 Tournament 10k+ Coin\n4. 📺 Video Ad\n5. Low Bet Table"}
              if(low.includes('safe')){return "🛡️ Safe Zone Trick:\n\nStar ★ ঘর Safe! ওখানে কেউ কাটতে পারবে না!\n\n2 টা Token একই Safe Zone এ রাখলে Super Safe!"}
              return "🏆 Ludo Star জেতার 100% Correct Trick:\n\n1. 🛡️ SAFE ZONE: Star ★ ঘরে থাকো!\n2. 🎲 TOKEN: একটা Home এর কাছে নাও, তারপর 2nd বের করো\n3. ⚔️ কখন মারবে: প্রতিপক্ষ Home এর কাছে গেলে কেটে দাও\n4. 🎯 6 পাইলে আগের Token আগাও!\n5. 💰 ছোট Table এ খেলো!"}
            if(low.includes('free fire')||low.includes('ff')){
              if(low.includes('headshot')){return "🎯 Free Fire Headshot:\n\nSensitivity: General 90, Red Dot 85, 2x 75\nAim মাথার লেভেলে রাখো\nDrag Trick: Fire Button উপরে Drag\nCharacter: Hayato + Kelly + Moco\nGun: MP40, M1887 Best!"}
              return "🔥 Free Fire Rank Push:\n\nCharacter: Alok + Jota + Kelly + Hayato\nGun: MP40 + M1887\nMap: Bermuda, Edge এ থাকো\nGloo 200+ রাখো\nTime: রাত 10PM-2AM best!"}
            if(low.includes('pubg')||low.includes('পাবজি')){
              if(low.includes('sensitivity')){return "🔫 PUBG Best Sensitivity:\n\nCamera: TPP 95%\nADS: Red Dot 55%, 3x 25%, 6x 18%\nCode: 7307-1085-6788-4282-435\n\nRecoil: Thumb নিচে টানো!"}
              return "🏆 PUBG Conqueror:\n\nMap: Erangel Classic\nGun: M416 + UMP\n10+ Match Daily, Top 10\nFixed Squad\nKD 4+ রাখো!"}
            if(low.includes('roblox')){return "🧱 Roblox Free Robux (Legal):\n\n1. Microsoft Rewards\n2. Premium Monthly\n3. Game Pass Sell\n4. Please Donate Game\n\nFake Generator Scam!"}
            if(low.includes('carrom')){return "🎯 Carrom Direct Shot:\n\nStriker মাঝখানে রাখো\nPower 70-80%\n45 Degree Angle Best\nQueen এর পিছনে মারো!"}
            if(low.includes('thank')||low.includes('ধন্যবাদ')){return "😊 Welcome ভাই! Logo টা কেমন লাগলো? 😍\n\nআরো হেল্প লাগলে বলো! 🎮"}
            return "😊 ভাই, আমি সব গেমের ব্যাপারে হেল্প করতে পারি, সঠিক ভাবে বলবো!\n\n🎲 Ludo Star - জেতার Trick\n🔥 Free Fire - Rank Push, Headshot\n🔫 PUBG - Sensitivity, Conqueror\n🧱 Roblox - Free Robux\n\nযা জানতে চাও লিখো! 👇";
          }
          async function ask(q){q=q||inp.value.trim();if(!q)return;addM(q,'user');inp.value='';let typingEl=showTyping();let correctAns=getCorrectAnswer(q);setTimeout(()=>{typingEl.remove();addM(correctAns,'ai');},600);}
          sendBtn.onclick=()=>ask();inp.onkeypress=e=>{if(e.key==='Enter')ask()}
          function startV(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Chrome ব্যবহার করো');let r=new SR();r.lang='bn-BD';r.onresult=e=>{inp.value=e.results[0][0].transcript;ask()};r.start()}
          </script></body></html>
          HTMLEND
          echo '{"appId":"com.myaisadi.app","appName":"SADI AI","webDir":"www"}' > capacitor.config.json
          npx cap add android
          cd android
          # --- CUSTOM LOGO SETUP ---
          # Copy custom icon to Android mipmap folders
          if [ -f "../icon.png" ]; then
            echo "Found custom icon.png, setting as app icon..."
            mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
            cp ../icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp ../icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp ../icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp ../icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp ../icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp ../icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp ../icon.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp ../icon.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp ../icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp ../icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi
          if [ -f "../www/icon.png" ]; then
            cp ../www/icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null
            cp ../www/icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null
            cp ../www/icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SADI-AI-V22-Custom-Logo
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
