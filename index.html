<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Sadi</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:20px}
.box{background:#222;padding:20px;border-radius:15px;margin-top:30px}
input{width:80%;padding:12px;border-radius:10px;border:none;margin:10px}
button{padding:12px 20px;border-radius:10px;border:none;background:#00ff88;font-weight:bold}
</style>
</head>
<body>
<h1>🤖 My AI Sadi</h1>
<div class="box">
<p>Assalamu Alaikum! Ami Sadi AI</p>
<input id="q" placeholder="Tumi ki jante chao?">
<br>
<button onclick="ask()">Ask</button>
<p id="ans"></p>
</div>
<script>
function ask(){
let v=document.getElementById('q').value;
document.getElementById('ans').innerText="Sadi vabche: '"+v+"' niye... (eita demo app, pore asol AI add korbo)";
}
</script>
</body>
  </html>
